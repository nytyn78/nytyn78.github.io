// --- BARCODE SCANNER -------------------------------------------------
let _scanActive = false;
let _scanStream = null;
let _scanInterval = null;

async function openBarcodeScanner() {
  if(_scanActive) return;
  _scanActive = true;

  // Build overlay
  const ov = document.createElement('div');
  ov.id = 'barcode-overlay';
  ov.innerHTML = `
    <div style="position:relative;width:100%;max-width:480px">
      <video id="scan-video" autoplay playsinline muted style="width:100%;border-radius:12px;display:block"></video>
      <div class="scan-frame"><div class="scan-line"></div></div>
    </div>
    <canvas id="scan-canvas"></canvas>
    <div style="color:#fff;font-size:14px;font-weight:700;margin-top:20px;text-align:center">Point camera at barcode</div>
    <div style="color:rgba(255,255,255,.6);font-size:12px;margin-top:6px;text-align:center">Hold steady — auto-detects</div>
    <button onclick="closeBarcodeScanner()" style="margin-top:24px;padding:12px 32px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:24px;font-size:14px;font-weight:700;cursor:pointer">✕ Cancel</button>
  `;
  document.body.appendChild(ov);

  try {
    _scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('scan-video');
    video.srcObject = _scanStream;
    await video.play();

    // Try native BarcodeDetector first (Android Chrome)
    if('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39'] });
      _scanInterval = setInterval(async () => {
        try {
          const codes = await detector.detect(video);
          if(codes.length > 0) {
            closeBarcodeScanner();
            fetchBarcode(codes[0].rawValue);
          }
        } catch(e) {}
      }, 400);
    } else {
      // Fallback: use canvas + ZXing via CDN
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';
      script.onload = () => {
        const canvas = document.getElementById('scan-canvas');
        const ctx = canvas.getContext('2d');
        const hints = new Map();
        const formats = [
          ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
          ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.CODE_128
        ];
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
        const reader = new ZXing.MultiFormatReader();
        reader.setHints(hints);
        _scanInterval = setInterval(() => {
          const v = document.getElementById('scan-video');
          if(!v || v.readyState < 2) return;
          canvas.width = v.videoWidth; canvas.height = v.videoHeight;
          ctx.drawImage(v, 0, 0);
          try {
            const lum = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
            const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(lum));
            const result = reader.decode(bmp);
            if(result) { closeBarcodeScanner(); fetchBarcode(result.getText()); }
          } catch(e) {}
        }, 400);
      };
      document.head.appendChild(script);
    }
  } catch(e) {
    closeBarcodeScanner();
    alert('Camera access denied. Please allow camera permission and try again.');
  }
}

function closeBarcodeScanner() {
  _scanActive = false;
  if(_scanInterval) { clearInterval(_scanInterval); _scanInterval = null; }
  if(_scanStream) { _scanStream.getTracks().forEach(t => t.stop()); _scanStream = null; }
  const ov = document.getElementById('barcode-overlay');
  if(ov) ov.remove();
}

async function fetchBarcode(code) {
  // Show loading in barcode-result
  const el = document.getElementById('barcode-result');
  if(el) el.innerHTML = `<div style="padding:12px;background:#E3F2FD;border-radius:10px;margin-bottom:8px;font-size:13px;color:#1565C0;font-weight:700">🔍 Looking up barcode ${code}...</div>`;

  try {
    const res = await fetch('https://world.openfoodfacts.org/api/v0/product/' + code + '.json');
    const data = await res.json();

    if(data.status !== 1 || !data.product) {
      if(el) el.innerHTML = `<div style="padding:12px;background:#FFEBEE;border-radius:10px;margin-bottom:8px;font-size:13px;color:#C62828;font-weight:700">❌ Product not found in database.<br><span style="font-weight:400;font-size:12px">Try searching manually instead.</span></div>`;
      return;
    }

    const p = data.product;
    const n = p.nutriments || {};
    const name = p.product_name || p.generic_name || 'Unknown Product';
    const brand = p.brands || '';
    const serving = p.serving_size || '100g';

    // Per 100g values (standardised)
    const per100 = {
      protein: Math.round((n['proteins_100g'] || n['proteins'] || 0) * 10) / 10,
      carbs:   Math.round((n['carbohydrates_100g'] || n['carbohydrates'] || 0) * 10) / 10,
      fat:     Math.round((n['fat_100g'] || n['fat'] || 0) * 10) / 10,
      cal:     Math.round(n['energy-kcal_100g'] || n['energy-kcal'] || (n['energy_100g']||0)/4.184 || 0)
    };

    // Show confirmation card
    if(el) el.innerHTML = `
      <div style="background:#E8F5E9;border:1.5px solid var(--teal);border-radius:12px;padding:14px;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700;color:var(--dark);margin-bottom:2px">📦 ${name}</div>
        ${brand ? `<div style="font-size:11px;color:#888;margin-bottom:8px">${brand}</div>` : ''}
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">
          <div style="text-align:center;background:#fff;border-radius:8px;padding:6px">
            <div style="font-size:14px;font-weight:700;color:#1565C0">${per100.protein}g</div>
            <div style="font-size:10px;color:#888">Protein</div>
          </div>
          <div style="text-align:center;background:#fff;border-radius:8px;padding:6px">
            <div style="font-size:14px;font-weight:700;color:#C62828">${per100.carbs}g</div>
            <div style="font-size:10px;color:#888">Carbs</div>
          </div>
          <div style="text-align:center;background:#fff;border-radius:8px;padding:6px">
            <div style="font-size:14px;font-weight:700;color:#6A1B9A">${per100.fat}g</div>
            <div style="font-size:10px;color:#888">Fat</div>
          </div>
          <div style="text-align:center;background:#fff;border-radius:8px;padding:6px">
            <div style="font-size:14px;font-weight:700;color:#555">${per100.cal}</div>
            <div style="font-size:10px;color:#888">kcal</div>
          </div>
        </div>
        <div style="font-size:11px;color:#888;margin-bottom:10px">Values per 100g · Serving size: ${serving}</div>
        <div style="display:flex;gap:8px">
          <input id="bc-qty" type="number" value="100" min="1" max="1000" style="width:70px;padding:8px;border:1.5px solid #DDD;border-radius:8px;font-size:13px;text-align:center"/>
          <span style="line-height:36px;font-size:12px;color:#888">grams</span>
          <button onclick="addBarcodeFood('${name.replace(/'/g,"\'")}',${per100.protein},${per100.carbs},${per100.fat},${per100.cal})" style="flex:1;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700">✅ Add to Log</button>
        </div>
        <button onclick="document.getElementById('barcode-result').innerHTML=''" style="width:100%;margin-top:8px;padding:8px;background:#F5F5F5;color:#888;border:none;border-radius:8px;font-size:12px">Dismiss</button>
      </div>`;
  } catch(e) {
    if(el) el.innerHTML = `<div style="padding:12px;background:#FFEBEE;border-radius:10px;margin-bottom:8px;font-size:13px;color:#C62828">❌ Network error. Check your connection.</div>`;
  }
}

function addBarcodeFood(name, p100, c100, f100, cal100) {
  const qtyEl = document.getElementById('bc-qty');
  const grams = parseFloat(qtyEl?.value || 100);
  const ratio = grams / 100;
  const food = {
    name: name + ' (' + grams + 'g)',
    protein: Math.round(p100 * ratio * 10) / 10,
    carbs:   Math.round(c100 * ratio * 10) / 10,
    fat:     Math.round(f100 * ratio * 10) / 10,
    cal:     Math.round(cal100 * ratio),
    category: 'Scanned'
  };
  addFood(food, 1);
  const el = document.getElementById('barcode-result');
  if(el) el.innerHTML = `<div style="padding:10px;background:#E8F5E9;border-radius:10px;margin-bottom:8px;font-size:13px;color:var(--green);font-weight:700">✅ ${food.name} added!</div>`;
}

function getAlarmEnabled(id) { return LS.get('alarm_'+id, true); }
function toggleAlarm(id) { LS.set('alarm_'+id, !getAlarmEnabled(id)); render(); }

function setAllAlarms() {
  const enabled = ALARMS.filter(a => getAlarmEnabled(a.id));
  if(enabled.length === 0) { alert('No alarms selected. Toggle some on first.'); return; }
  
  let i = 0;
  function setNext() {
    if(i >= enabled.length) {
      alert('✅ Done! All ' + enabled.length + ' alarms set.');
      return;
    }
    const alarm = enabled[i];
    i++;
    triggerAlarmIntent(alarm, setNext);
  }
  setNext();
}

function setOneAlarm(id) {
  const alarm = ALARMS.find(a=>a.id===id);
  if(!alarm) return;
  triggerAlarmIntent(alarm, null);
}

function triggerAlarmIntent(alarm, callback) {
  const [h,m] = alarm.time.split(':').map(Number);
  
  // Try multiple approaches in sequence for OnePlus OxygenOS compatibility
  const attempts = [
    // Standard Android intent
    `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(alarm.label)};Z.android.intent.extra.alarm.SKIP_UI=false;Z.android.intent.extra.alarm.VIBRATE=true;end`,
    // OnePlus/OPPO clock package explicit
    `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(alarm.label)};Z.android.intent.extra.alarm.SKIP_UI=false;package=com.oneplus.deskclock;end`,
    // Google clock fallback
    `intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${h};i.android.intent.extra.alarm.MINUTES=${m};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(alarm.label)};Z.android.intent.extra.alarm.SKIP_UI=false;package=com.google.android.deskclock;end`,
  ];

  let tried = 0;
  function tryNext() {
    if(tried >= attempts.length) {
      if(callback) callback();
      return;
    }
    const a = document.createElement('a');
    a.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
    a.href = attempts[tried++];
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); }, 500);
    if(callback) setTimeout(callback, 4500);
  }
  tryNext();
}

let notifScheduleTimer = null;

function getNotifEnabled(id) { return LS.get('notif_'+id, true); }
function toggleNotif(id) { LS.set('notif_'+id, !getNotifEnabled(id)); render(); }

async function requestNotifPermission() {
  if(!('Notification' in window)) { alert('Notifications not supported on this browser.'); return; }
  const perm = await Notification.requestPermission();
  if(perm === 'granted') {
    LS.set('notif_enabled', true);
    scheduleNotifications();
    render();
    alert('✅ Notifications enabled! You\'ll get reminders throughout the day.');
  } else {
    alert('Notifications blocked. Please allow notifications for this site in your browser settings:\nSettings → Apps → Chrome → Notifications → Allow');
  }
}

function disableNotifications() {
  LS.set('notif_enabled', false);
  if(notifScheduleTimer) { clearTimeout(notifScheduleTimer); notifScheduleTimer=null; }
  render();
}

function scheduleNotifications() {
  if(!('Notification' in window)) return;
  if(Notification.permission !== 'granted') return;
  if(!LS.get('notif_enabled', false)) return;
  if(notifScheduleTimer) clearTimeout(notifScheduleTimer);

  const now = new Date();
  const enabled = NOTIF_SCHEDULE.filter(n => getNotifEnabled(n.id));

  // Helper: fire via service worker if available (works when screen locked / app backgrounded)
  // Falls back to new Notification() if SW not available
  async function fireNotif(n) {
    if(!getNotifEnabled(n.id) || !LS.get('notif_enabled', false)) return;
    if(Notification.permission !== 'granted') return;
    const opts = {
      body: n.body,
      icon: '/icon-192.png',
      badge: '/icon-192.png',
      tag: n.id,
      requireInteraction: false,
      vibrate: [200, 100, 200],
    };
    try {
      if('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification(n.title, opts);
      } else {
        new Notification(n.title, opts);
      }
    } catch(e) {
      // Fallback silently
      try { new Notification(n.title, opts); } catch(e2) {}
    }
  }

  enabled.forEach(n => {
    const fire = new Date();
    fire.setHours(n.h, n.m, 0, 0);
    if(fire <= now) return;
    const delay = fire - now;
    setTimeout(() => fireNotif(n), delay);
  });

  // Re-schedule at midnight for next day
  const midnight = new Date();
  midnight.setHours(24, 0, 0, 0);
  notifScheduleTimer = setTimeout(scheduleNotifications, midnight - now);
}

// Auto-start scheduling if already enabled
if(LS.get('notif_enabled', false) && typeof Notification !== 'undefined' && Notification.permission === 'granted') {
  scheduleNotifications();
}

// SW version check — uses the SW's own reported version as the source of truth
// No hardcoded version needed; mismatch only triggers reload on genuine updates
let _swVersion = null;
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').then(reg => {
    // Poll for a new service worker installing or waiting
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if(newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          // New SW installed and waiting — force immediate takeover
          newWorker.postMessage({ type: 'SKIP_WAITING' });
        }
      });
    });
    // When the new SW takes control, reload once
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if(!refreshing) { refreshing = true; window.location.reload(); }
    });
    // Also check if current active cache is outdated by asking the SW
    if(reg.active) {
      reg.active.postMessage({ type: 'GET_VERSION' });
    }
  }).catch(()=>{});
  // Listen for version reply from SW
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data && e.data.type === 'SW_VERSION') {
      // Just store the version — no mismatch reload needed
      _swVersion = e.data.version;
    }
    if(e.data && e.data.type === 'SW_UPDATED') {
      window.location.reload();
    }
  });
}

    <button onclick="undoRemove()" style="background:var(--teal);color:#fff;border:none;border-radius:12px;padding:4px 12px;font-size:12px;font-weight:700">Undo</button>

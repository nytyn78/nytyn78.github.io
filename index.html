/* ============================================================
   NYTYN HEALTH TRACKER — STYLESHEET
   Sections:
   1. Reset & CSS Variables
   2. Base Elements
   3. Layout & Structure
   4. Components (Cards, Inputs, Tabs, Buttons)
   5. Feature-specific (Meals, Exercises, Rings, Charts)
   6. Overlays & Modals (Barcode, Food Camera)
   7. Animations & Keyframes
   8. Dark Mode
   ============================================================ */

/* ── 1. RESET & CSS VARIABLES ── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --teal: #00695C;
  --lt-teal: #E0F2F1;
  --gold: #F57F17;
  --lt-gold: #FFF8E1;
  --dark: #1A1A2E;
  --red: #E53935;
  --green: #388E3C;
  --bg: #F4F7F6;
  --muted: #888;
  --ring-bg: #E0E0E0;
  --font: Georgia, "Times New Roman", serif;
  --mono: "Courier New", monospace;
  --shadow: 0 2px 14px rgba(0,0,0,0.07);
  --radius: 16px;
}

/* ── 2. BASE ELEMENTS ── */
body {
  background: var(--bg);
  font-family: var(--font);
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  overflow-x: hidden;
}
button { font-family: var(--font); cursor: pointer; }
input  { font-family: var(--font); outline: none; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ── 3. LAYOUT & STRUCTURE ── */
.hdr {
  background: linear-gradient(135deg, var(--dark) 0%, var(--teal) 100%);
  padding: 22px 18px 18px;
  color: #fff;
}
.content { padding: 14px 14px 90px; }

/* ── 4. COMPONENTS ── */

/* Cards */
.card {
  background: #fff;
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  animation: fadeUp .18s ease both;
}

/* Section heading */
.sec { font-size: 14px; font-weight: 700; color: var(--teal); margin-bottom: 12px; }

/* Inputs */
.inp {
  padding: 9px 13px;
  border: 1.5px solid #DDD;
  border-radius: 10px;
  font-size: 14px;
  width: 100%;
  transition: border .2s;
  background: #fff;
}
.inp:focus { border-color: var(--teal); }

/* Tabs — top nav */
.tabs {
  display: flex;
  gap: 4px;
  padding: 10px 12px;
  background: #fff;
  border-bottom: 1px solid #EEE;
  overflow-x: auto;
  position: sticky;
  top: 0;
  z-index: 100;
}
.tab {
  padding: 7px 13px;
  border-radius: 20px;
  border: none;
  font-size: 12px;
  white-space: nowrap;
  font-family: var(--font);
  transition: all .2s;
}
.tab.on  { background: var(--teal); color: #fff; font-weight: 700; }
.tab:not(.on) { background: transparent; color: #666; }

/* Sub-tabs */
.stab { padding: 6px 13px; border-radius: 14px; border: none; font-size: 12px; font-family: var(--font); transition: all .2s; }
.stab.on     { background: var(--dark); color: #fff; font-weight: 700; }
.stab:not(.on) { background: #F0F0F0; color: #666; }

/* Checkmark circle */
.chk {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid #DDD;
  background: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-left: 8px;
  transition: all .2s;
}
.chk.on { border-color: var(--green); background: var(--green); }

/* Badges */
.badge-green { background: #E8F5E9; color: var(--green); }
.badge-red   { background: #FFEBEE; color: var(--red); }
.badge-gold  { background: var(--lt-gold); color: var(--gold); }
.badge-teal  { background: var(--lt-teal); color: var(--teal); }

/* ── 5. FEATURE-SPECIFIC ── */

/* Macro rings */
.ring { display: flex; flex-direction: column; align-items: center; gap: 3px; }

/* Meal rows */
.meal-hdr {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  border: 1.5px solid #E8F0EE;
  background: #F8FFFE;
  margin-bottom: 0;
}
.meal-hdr.open { background: var(--lt-teal); border-color: var(--teal); }
.meal-detail {
  padding: 12px 14px;
  background: #FAFFFE;
  border: 1.5px solid var(--teal);
  border-top: none;
  border-radius: 0 0 10px 10px;
  margin-bottom: 6px;
}

/* Exercise cards */
.excard {
  padding: 12px 14px;
  border-radius: 12px;
  margin-bottom: 8px;
  border: 1px solid #EEE;
  background: #fff;
  cursor: pointer;
  user-select: none;
  transition: all .2s;
}
.excard.done   { background: #E8F5E9; border-color: var(--green); }
.excard.locked { background: #F9F9F9; opacity: .6; cursor: not-allowed; }

/* Srow (settings rows) */
.srow { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #F5F5F5; }

/* ── 6. OVERLAYS & MODALS ── */

/* Barcode scanner */
#barcode-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: #000;
  z-index: 9998;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#barcode-overlay video  { width: 100%; max-width: 480px; border-radius: 12px; }
#barcode-overlay canvas { display: none; }

.scan-frame {
  position: absolute;
  width: 240px; height: 160px;
  border: 3px solid var(--teal);
  border-radius: 12px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,.55);
}
.scan-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--teal);
  animation: scanline 2s linear infinite;
}

/* ── 7. ANIMATIONS ── */
@keyframes fadeUp  { from { opacity:0; transform:translateY(5px) } to { opacity:1; transform:translateY(0) } }
@keyframes fi      { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }
@keyframes spin    { from { transform:rotate(0deg) } to { transform:rotate(360deg) } }
@keyframes scanline { 0% { top:0 } 100% { top:100% } }

.fade { animation: fi .3s ease; }

/* ── 8. DARK MODE ── */
@media (prefers-color-scheme: dark) {
  :root {
    --teal: #26A69A;
    --lt-teal: #1A3D3A;
    --gold: #FFB300;
    --lt-gold: #2D2200;
    --dark: #E8EAF6;
    --red: #EF5350;
    --green: #66BB6A;
    --bg: #0F0F0F;
    --ring-bg: #333;
    --shadow: 0 2px 14px rgba(0,0,0,0.4);
  }

  body   { background: var(--bg); color: #E0E0E0; }
  .card  { background: #1E1E1E; color: #E0E0E0; }
  .inp   { background: #2A2A2A; border-color: #444; color: #E0E0E0; }
  .inp:focus { border-color: var(--teal); }
  .inp::placeholder { color: #666; }
  .tabs  { background: #1A1A1A; border-bottom-color: #333; }
  .tab:not(.on)  { color: #999; }
  .stab:not(.on) { background: #2A2A2A; color: #999; }
  .srow  { border-bottom-color: #2A2A2A; }
  .meal-hdr  { background: #252525; border-color: #333; }
  .meal-hdr.open { background: var(--lt-teal); border-color: var(--teal); }
  .meal-detail   { background: #1A2E2B; border-color: var(--teal); }
  .excard        { background: #1E1E1E; border-color: #333; }
  .excard.done   { background: #1A3320; border-color: #388E3C; }
  .excard.locked { background: #181818; }
  .chk   { background: #2A2A2A; border-color: #444; }
  .badge-green { background: #1A3320; color: #66BB6A; }
  .badge-red   { background: #2D1515; color: #EF5350; }
  .badge-gold  { background: #2D2200; color: #FFB300; }
  .badge-teal  { background: var(--lt-teal); color: var(--teal); }

  /* SVG chart text */
  svg text { fill: #AAA !important; }

  /* Nav bar */
  .nav { background: #1A1A1A !important; border-top-color: #333 !important; }
  .nav button     { color: #888 !important; }
  .nav button.on  { color: var(--teal) !important; }

  /* Overlays */
  #circuit-overlay { background: #0F0F0F !important; }
  #undo-bar        { background: #333 !important; }
  .hdr { background: linear-gradient(135deg, #0A0A1A 0%, #00695C 100%) !important; }

  /* Scrollbar */
  ::-webkit-scrollbar       { width: 4px; }
  ::-webkit-scrollbar-track { background: #1A1A1A; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

  /* Inline background overrides */
  [style*="background:#fff"],[style*="background: #fff"],
  [style*="background:#FAFAFA"],[style*="background:#F5F5F5"],
  [style*="background:#F9F9F9"],[style*="background:#FAFFFE"],
  [style*="background:#F8FFFE"]  { background: #252525 !important; }
  [style*="background:#F0F0F0"]  { background: #2A2A2A !important; }
  [style*="background:#F4F7F6"]  { background: #0F0F0F !important; }
  [style*="background:#E8F5E9"]  { background: #1A3320 !important; }
  [style*="background:#FFEBEE"]  { background: #2D1515 !important; }
  [style*="background:#FFF8E1"]  { background: #2D2200 !important; }

  [style*="background:#EDE7F6"]  { background: #1E1528 !important; }
  [style*="background:#F0FAF8"]  { background: #0D2520 !important; }
  [style*="background:#FFF8E1;border:1px solid #FFE082"] { background: #2D2200 !important; border-color: #664400 !important; }
  [style*="background:#FFEBEE;border:1px solid #EF9A9A"] { background: #2D1515 !important; border-color: #661515 !important; }

  [style*="color:#555"],[style*="color: #555"],

  [style*="border-bottom:1px solid #F5F5F5"] { border-bottom-color: #2A2A2A !important; }

  [style*="border:1px solid #EEE"]           { border-color: #333 !important; }
  [style*="border:1.5px solid #E8F0EE"]      { border-color: #333 !important; }
  [style*="border:1px solid #DDD"]           { border-color: #444 !important; }

  /* Misc */
  input[type="number"] { color-scheme: dark; }
}
</style>

let FOOD_DB = [];
async function loadFoodDB() {
  try {
    const res = await fetch('foods.json');

    FOOD_DB = await res.json();
    // Also re-load any custom foods saved by user
    LS.get('custom_foods',[]).forEach(f => { if(!FOOD_DB.find(x=>x.name===f.name)) FOOD_DB.push(f); });
  } catch(e) {
    console.warn('foods.json load failed, using empty DB:', e.message);
  }
}

/** Quick lookup by partial name (case-insensitive) */
const searchFoods = (query, db = FOOD_DB) => {
  if (!query?.trim()) return db;
  const q = query.toLowerCase();
  return db.filter(f => f.name.toLowerCase().includes(q));
};

const TRIP_START = "2025-03-29";
const TRIP_END   = "2025-04-02";

/** Returns active programme days (excluding trip break) */
const getActiveDays = (startDateStr) => {
  if (!startDateStr) return 0;
  const start = new Date(startDateStr); start.setHours(0, 0, 0, 0);
  const now   = new Date();             now.setHours(0, 0, 0, 0);
  if (now < start) return 0;
  const rawDiff = Math.floor((now - start) / 86400000);
  const tripS = new Date(TRIP_START); tripS.setHours(0, 0, 0, 0);
  const tripE = new Date(TRIP_END);   tripE.setHours(0, 0, 0, 0);
  let tripDays = 0;
  if (now > tripS) {
    const overlapEnd = now < tripE ? now : tripE;
    tripDays = Math.max(0, Math.floor((overlapEnd - tripS) / 86400000));
  }
  return Math.max(0, rawDiff - tripDays);
};

const getPhase = (startDateStr) => {
  const week = Math.floor(getActiveDays(startDateStr) / 7) + 1;
  if (week <= 4) return 1;
  if (week <= 8) return 2;
  return 3;
};

const getPhaseWeek = (startDateStr) =>
  Math.min(Math.floor(getActiveDays(startDateStr) / 7) + 1, 12);

const isTripDay = () => {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const ts  = new Date(TRIP_START); ts.setHours(0, 0, 0, 0);
  const te  = new Date(TRIP_END);   te.setHours(0, 0, 0, 0);
  return now >= ts && now <= te;
};

// One-time migration: infer fastBest for past days that have entries but no fastBest
(function migrateFastingHistory() {
  if(LS.get('fast_migration_v2', false)) return;
  const today = isoToday();
  let changed = false;
  // Collect all hlog keys first (localStorage iteration is unstable if modified mid-loop)
  const keys = [];
  for(let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if(key && key.startsWith('hlog_')) keys.push(key);
  }
  keys.forEach(key => {
    const date = key.slice(5);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date) || date === today) return;
    const day = LS.get(key, null);
    if(!day || day.fastBest > 0) return; // already has data
    const caloricEntries = (day.entries||[]).filter(e => (e.cal||0) >= 20 && e.ts);
    if(caloricEntries.length === 0) return;
    caloricEntries.sort((a,b) => a.ts - b.ts);
    const firstBite = caloricEntries[0].ts;
    // Fast assumed to start at 19:00 the PREVIOUS calendar day
    const prevDate = new Date(date);
    prevDate.setDate(prevDate.getDate() - 1);
    const prevStr = prevDate.getFullYear() + '-' + String(prevDate.getMonth()+1).padStart(2,'0') + '-' + String(prevDate.getDate()).padStart(2,'0');
    const fastStart = new Date(prevStr + 'T19:00:00').getTime();
    const inferredFast = Math.floor((firstBite - fastStart) / 1000);
    // Only use if plausible (between 10h and 30h)
    if(inferredFast >= 10*3600 && inferredFast <= 30*3600) {
      day.fastBest = inferredFast;
      LS.set(key, day);
      changed = true;
    }
  });
  LS.set('fast_migration_v2', true);
  if(changed) setTimeout(() => { if(typeof fbPush === 'function') fbPush(); }, 2000);
})();

// Cross-midnight fast carry-over
// If yesterday's fast was still running when midnight passed, continue it today
function carryFastOverMidnight() {
  const today = isoToday();

  // Case 1: Same-day reload — fast already saved in today's log
  const todayDay = LS.get('hlog_'+today, null);
  if(todayDay && todayDay.fasting && todayDay.fastStart) {
    const elapsed = Math.floor((Date.now() - todayDay.fastStart) / 1000);
    if(elapsed > 0 && elapsed < 48*3600) {
      return todayDay; // fast still running, restore it
    }
  }

  // Case 2: Fast started yesterday, crossed midnight into today
  const yd = new Date(); yd.setDate(yd.getDate()-1);
  const yStr = yd.getFullYear()+'-'+String(yd.getMonth()+1).padStart(2,'0')+'-'+String(yd.getDate()).padStart(2,'0');
  const yDay = LS.get('hlog_'+yStr, null);
  if(!yDay) return null;

  if(yDay.fasting && yDay.fastStart) {
    const elapsed = Math.floor((Date.now() - yDay.fastStart) / 1000);
    if(elapsed > 0 && elapsed < 48*3600) {
      // Save yesterday's fast as ended at midnight
      const midnight = new Date(today+'T00:00:00').getTime();
      const originalStart = yDay.fastStart;
      const ySecs = Math.floor((midnight - originalStart) / 1000);
      yDay.fastBest = Math.max(yDay.fastBest||0, ySecs);
      yDay.fasting = false;
      yDay.fastStart = null;
      saveDay(yStr, yDay);

      // Carry fast into today from original start time
      const newToday = loadDay(today);
      newToday.fasting = true;
      newToday.fastStart = originalStart;
      saveDay(today, newToday);
      return newToday;
    }
  }
  return null;
}

      const data = snap.val();
      // Only restore if cloud is newer or local has no start date
      if(data.prog_start && !S.startDate) {
        S.startDate = data.prog_start;
        LS.set('prog_start', data.prog_start);
      }
      if(data.diet_mode) { S.diet=data.diet_mode; LS.set('diet_mode',data.diet_mode); }
      if(data.history) { LS.set('hlog_history', data.history); S.hist=data.history; }
      // Restore daily logs from Firebase
      if(data.logs) {
        Object.entries(data.logs).forEach(([k,v]) => {
          const date = k.replace(/_/g,'-');
          LS.set('hlog_'+date, v);
        });
      }
      // Restore today if same date
      if(data.today && data.today_date === S.date) {
        S.day = {...blankDay(), ...data.today};
        // If Mar 12 weight/water fix has been applied, don't let cloud restore old values
        if(S.date === '2026-03-12' && LS.get('mar12_fixed', false)) {
          S.day.weight = null;
          S.day.water = 0;
        }
        saveDay(S.date, S.day);
      }
      if(data.done_ex && data.today_date === S.date) {
        S.doneEx = data.done_ex;
        LS.set('done_ex_'+S.date, S.doneEx);
      }
      if(data.ozempic_last) LS.set('med_Ozempic_last', data.ozempic_last);
      if(data.start_weight && data.start_weight >= 115) LS.set('start_weight', data.start_weight);
      if(data.goal_weight) LS.set('goal_weight', data.goal_weight);
      if(data.custom_foods && Array.isArray(data.custom_foods) && data.custom_foods.length) {
        // Merge cloud custom foods with local — cloud wins for same name
        const local = LS.get('custom_foods', []);
        const merged = [...data.custom_foods];
        local.forEach(lf => { if(!merged.find(cf => cf.name === lf.name)) merged.push(lf); });
        LS.set('custom_foods', merged);
        // Also add to live FOOD_DB
        merged.forEach(f => { if(!FOOD_DB.find(x => x.name === f.name)) FOOD_DB.push(f); });
      }
      render();
    }
  } catch(e) { console.warn('fbPull failed:', e); }
  finally { fbSyncing = false; }
}

async function forceRestoreFromFirebase() {
  if(!fbDb || !fbUser) { alert('Not connected to Firebase. Connect first in Settings.'); return; }
  const btn = document.getElementById('force-restore-btn');
  if(btn) { btn.textContent = '⏳ Restoring...'; btn.disabled = true; }
  try {
    const { ref, get } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const snap = await get(ref(fbDb, 'users/'+fbUser));
    if(!snap.exists()) { alert('No data found in Firebase for your account.'); return; }
    const data = snap.val();
    // Merge history — keep local entries not in cloud, add cloud entries not local
    const localHist = LS.get('hlog_history', []);
    const cloudHist = data.history || [];
    const merged = [...cloudHist];
    localHist.forEach(le => {
      if(!merged.find(ce => ce.date === le.date)) merged.push(le);
    });
    merged.sort((a,b) => b.date.localeCompare(a.date));
    LS.set('hlog_history', merged);
    S.hist = merged;
    // Restore all daily logs from cloud without overwriting local ones that are newer
    if(data.logs) {
      Object.entries(data.logs).forEach(([k, v]) => {
        const date = k.replace(/_/g, '-');
        const local = LS.get('hlog_'+date, null);
        // Only overwrite if local is blank/missing
        if(!local || !(local.entries||[]).length) {
          LS.set('hlog_'+date, v);
        }
      });
    }
    render();
    const count = merged.length;
    if(btn) { btn.textContent = '✅ Restored ' + count + ' days!'; }
    setTimeout(() => { if(btn) { btn.textContent = '☁ Restore All Data from Firebase'; btn.disabled = false; }}, 3000);
  } catch(e) {
    alert('Restore failed: ' + e.message);
    if(btn) { btn.textContent = '☁ Restore All Data from Firebase'; btn.disabled = false; }
  }
}

function calcMacros(profile) {
  const { age, heightCm, currentWeight, goalWeight, gender, activityLevel, conditions, medications, dietMode } = profile;
  const w = currentWeight || 80, h = heightCm || 170, a = age || 35;

  // -- BMI & Adjusted Body Weight (ABW) --
  // For BMI >30, using actual weight in BMR overestimates metabolic rate.
  // ABW = IBW + 0.4 * (actual - IBW) is the clinical standard for obese dosing.
  const bmi = w / ((h/100)**2);
  const hIn = h / 2.54;
  const ibw = (gender === 'female' ? 45.5 : 50) + 2.3 * Math.max(0, hIn - 60);
  const abw = bmi > 30 ? ibw + 0.4*(w - ibw) : w;

  // -- BMR via Mifflin-St Jeor using ABW --
  const bmr = gender === 'female'
    ? 10*abw + 6.25*h - 5*a - 161
    : 10*abw + 6.25*h - 5*a + 5;

  // -- Activity multiplier (conservative for high BMI) --
  const multMap = { sedentary:1.2, light:1.3, moderate:1.45, active:1.6 };
  const mult = bmi > 35
    ? Math.min(1.3, multMap[activityLevel]||1.3)
    : (multMap[activityLevel]||1.3);
  const tdee = Math.round(bmr * mult);

  // -- Calorie target --
  // Deficit scales with BMI (higher BMI = safer to cut more)
  let deficit = bmi > 35 ? 650 : bmi > 30 ? 500 : 350;
  let cal = tdee - deficit;

  // Ozempic: clinical data shows patients eat ~30-35% less than TDEE.
  // Apply as intake cap (not additional deficit — avoid double-counting).
  if(medications.includes('ozempic')) cal = Math.min(cal, Math.round(tdee * 0.65));

  // Floor: preserve metabolic rate & adherence
  const calFloor = gender === 'female' ? 1200 : 1300;
  cal = Math.max(calFloor, cal);
  cal = Math.round(cal / 50) * 50;

  // -- Protein: 1.2g/kg ABW (preserve muscle during loss, realistic to achieve) --
  let protein = Math.round(abw * 1.2);
  // Saroglitazar/NAFLD: slightly higher protein supports liver
  if(medications.includes('saroglitazar')) protein += 5;
  protein = Math.min(130, Math.max(90, protein));

  // -- Carbs --
  let carbs = dietMode === 'keto' ? 22 : 45;
  if(conditions.includes('diabetes')) carbs = Math.min(30, carbs);
  if(conditions.includes('pcos') && carbs > 35) carbs = 35;

  // -- Fat: fill remaining; keto needs min 70g to sustain ketosis --
  let fat = Math.round((cal - protein*4 - carbs*4) / 9);
  fat = Math.max(dietMode === 'keto' ? 70 : 45, fat);

  // -- Final calories from actual macros --
  const finalCal = Math.round(protein*4 + carbs*4 + fat*9);

  return { protein, carbs, fat, cal: finalCal, tdee, bmi: +bmi.toFixed(1) };
}

  saveSwaps();
  render();
}

                   voices.find(v => v.lang.startsWith('en-IN')) ||
                   voices.find(v => v.name.toLowerCase().includes('indian')) ||
                   voices.find(v => v.lang.startsWith('en-GB')) ||
                   voices.find(v => v.lang.startsWith('en')) ||
                   voices[0];
  };
  if(speechSynthesis.getVoices().length) setVoice();
  else speechSynthesis.addEventListener('voiceschanged', setVoice);
}
initSpeech();

function speak(text, urgent=false) {
  if(!SPEECH_ENABLED || !('speechSynthesis' in window)) return;
  if(urgent) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if(SPEECH_VOICE) u.voice = SPEECH_VOICE;
  u.rate = 1.05;
  u.pitch = 1.0;
  u.volume = 1.0;
  speechSynthesis.speak(u);
}

function toggleSpeech() {
  SPEECH_ENABLED = !SPEECH_ENABLED;
  LS.set('speech_enabled', SPEECH_ENABLED);
  if(!SPEECH_ENABLED && 'speechSynthesis' in window) speechSynthesis.cancel();
  if(SPEECH_ENABLED) speak("Voice guide on");
  render();
}

// --- PER-EXERCISE PACE -----------------------------------------------
// User-customizable pace per exercise (seconds per rep)
function getExPace(exName) {
  const paces = LS.get('ex_paces', {});
  return paces[exName] || 3; // default 3 sec/rep
}
function setExPace(exName, secs) {
  const paces = LS.get('ex_paces', {});
  paces[exName] = +secs;
  LS.set('ex_paces', paces);
}
// Default reps per set if not parseable from string
function parseReps(repStr) {
  if(!repStr) return 10;
  const m = repStr.match(/(\d+)/);
  return m ? +m[1] : 10;
}
// Default sets per exercise
function parseSets(setStr) {
  if(!setStr) return 3;
  const m = setStr.match(/(\d+)/);
  return m ? +m[1] : 3;
}

function circuitExList() {
  const ts = todaySched(), phwk = pw();
  const all = [
    ...(ts.strength ? STRENGTH_EXERCISES : []),
    ...(ts.core ? [...CORE_EXERCISES_EARLY, ...CORE_EXERCISES_LATE] : [])
  ];
  return all.filter(e => !(e.phase === 2 && phwk < 5));
}

// ============================================================================
// CLASSIC CIRCUIT (original, kept for users who don't want voice)
// ============================================================================
function startCircuit() {
  stopCircuitTimer();
  S.circuit = { active:true, round:1, exIdx:0, phase:'exercise', restSecs:0, timerSecs:0, timerId:null };
  const ex = circuitExList()[0];
  if(ex && TIMED_EX[ex.name]) {
    S.circuit.timerSecs = TIMED_EX[ex.name];
    startCircuitTimer();
  }
  render();
}

function stopCircuit() {
  stopCircuitTimer();
  S.circuit.active = false;
  render();
}

function startCircuitTimer() {
  stopCircuitTimer();
  S.circuit.timerId = setInterval(() => {
    if(S.circuit.phase === 'rest') {
      S.circuit.restSecs--;
      if(S.circuit.restSecs <= 0) {
        S.circuit.phase = 'exercise';
        S.circuit.exIdx = 0;
        const ex = circuitExList()[S.circuit.exIdx];
        if(ex && TIMED_EX[ex.name]) {
          S.circuit.timerSecs = TIMED_EX[ex.name];
        } else {
          S.circuit.timerSecs = 0;
        }
        stopCircuitTimer();
        render();
        return;
      }
    } else if(S.circuit.timerSecs > 0) {
      S.circuit.timerSecs--;
      if(S.circuit.timerSecs <= 0) {
        circuitNext();
        return;
      }
    }
    const el = document.getElementById('circuit-timer');
    if(el) {
      if(S.circuit.phase === 'rest') {
        el.textContent = fmtSecs(S.circuit.restSecs);
      } else if(S.circuit.timerSecs > 0) {
        el.textContent = fmtSecs(S.circuit.timerSecs);
      }
    }
  }, 1000);
}

function stopCircuitTimer() {
  if(S.circuit.timerId) { clearInterval(S.circuit.timerId); S.circuit.timerId = null; }
}

function fmtSecs(s) {
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function circuitNext() {
  stopCircuitTimer();
  const exList = circuitExList();
  const curEx = exList[S.circuit.exIdx];
  if(curEx && !S.doneEx.includes(curEx.name)) {
    S.doneEx.push(curEx.name);
    LS.set('done_ex_' + S.date, S.doneEx);
  }
  const nextIdx = S.circuit.exIdx + 1;
  if(nextIdx >= exList.length) {
    if(S.circuit.round >= CIRCUIT_TOTAL_ROUNDS) {
      S.circuit.active = false;
      persist(); render(); return;
    }
    S.circuit.phase = 'rest';
    S.circuit.restSecs = REST_BETWEEN_ROUNDS;
    S.circuit.round++;
    startCircuitTimer();
    render(); return;
  }
  S.circuit.exIdx = nextIdx;
  S.circuit.phase = 'exercise';
  const nextEx = exList[nextIdx];
  if(nextEx && TIMED_EX[nextEx.name]) {
    S.circuit.timerSecs = TIMED_EX[nextEx.name];
    startCircuitTimer();
  } else {
    S.circuit.timerSecs = 0;
  }
  render();
}

function circuitSkip() {
  circuitNext();
}

// ============================================================================
// GUIDED CIRCUIT — voice-driven, auto-counting, full-screen
// ============================================================================
function startGuidedCircuit() {
  stopGuidedTimer();
  const exList = circuitExList();
  if(!exList.length) { alert('No exercises scheduled today.'); return; }
  S.guided = {
    active: true,
    exIdx: 0,
    setNum: 1,
    phase: 'ready',     // 'ready' | 'counting' | 'rest_set' | 'rest_ex' | 'done'
    repNum: 0,
    repsTarget: parseReps(exList[0].reps),
    setsTarget: parseSets(exList[0].sets),
    pace: getExPace(exList[0].name),
    secsLeft: 0,
    timerId: null,
    startTs: Date.now(),
  };
  speak(`Starting circuit. First exercise: ${exList[0].name}. ${S.guided.setsTarget} sets of ${S.guided.repsTarget} reps. Get ready.`, true);
  // Auto-start after 3 sec ready countdown
  setTimeout(() => {
    if(S.guided.active && S.guided.phase === 'ready') startGuidedSet();
  }, 3500);
  render();
}

function stopGuidedCircuit() {
  stopGuidedTimer();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  S.guided = null;
  render();
}

function stopGuidedTimer() {
  if(S.guided?.timerId) { clearInterval(S.guided.timerId); S.guided.timerId = null; }
}

function startGuidedSet() {
  stopGuidedTimer();
  const exList = circuitExList();
  const ex = exList[S.guided.exIdx];
  const isTimed = !!TIMED_EX[ex.name];

  S.guided.phase = 'counting';
  S.guided.repNum = 0;
  S.guided.pace = getExPace(ex.name);

  if(isTimed) {
    // Timed exercise — countdown the hold
    S.guided.secsLeft = TIMED_EX[ex.name];
    speak(`Set ${S.guided.setNum}. Hold for ${S.guided.secsLeft} seconds. Go.`, true);
    S.guided.timerId = setInterval(() => {
      S.guided.secsLeft--;
      // Speak countdown at 10, 5, 4, 3, 2, 1
      if(S.guided.secsLeft === 10) speak("10 seconds");
      if([5,4,3,2,1].includes(S.guided.secsLeft)) speak(String(S.guided.secsLeft));
      if(S.guided.secsLeft <= 0) {
        speak("Done.", true);
        stopGuidedTimer();
        guidedSetComplete();
      }
      const el = document.getElementById('guided-counter');
      if(el) el.textContent = S.guided.secsLeft;
    }, 1000);
  } else {
    // Rep-based exercise — speak each rep on pace
    speak(`Set ${S.guided.setNum}. Go.`, true);
    S.guided.repNum = 0;
    // Wait pace seconds before first count to give the user time to position
    setTimeout(() => {
      if(!S.guided?.active || S.guided.phase !== 'counting') return;
      S.guided.repNum = 1;
      speak("one");
      const el = document.getElementById('guided-counter');
      if(el) el.textContent = S.guided.repNum;
      S.guided.timerId = setInterval(() => {
        S.guided.repNum++;
        if(S.guided.repNum > S.guided.repsTarget) {
          speak("Set complete.", true);
          stopGuidedTimer();
          guidedSetComplete();
          return;
        }
        // Convert number to words for cleaner speech
        speak(numToWord(S.guided.repNum));
        const el2 = document.getElementById('guided-counter');
        if(el2) el2.textContent = S.guided.repNum;
      }, S.guided.pace * 1000);
    }, S.guided.pace * 1000);
  }
  render();
}

function numToWord(n) {
  const words = ['', 'one','two','three','four','five','six','seven','eight','nine','ten',
    'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen',
    'nineteen','twenty'];
  return words[n] || String(n);
}

function guidedSetComplete() {
  stopGuidedTimer();
  const exList = circuitExList();
  // Set finished — check if more sets remain for this exercise
  if(S.guided.setNum < S.guided.setsTarget) {
    // Rest between sets
    S.guided.phase = 'rest_set';
    S.guided.secsLeft = REST_BETWEEN_SETS;
    speak(`Rest ${REST_BETWEEN_SETS} seconds.`);
    S.guided.timerId = setInterval(() => {
      S.guided.secsLeft--;
      if([5,4,3,2,1].includes(S.guided.secsLeft)) speak(String(S.guided.secsLeft));
      if(S.guided.secsLeft <= 0) {
        stopGuidedTimer();
        S.guided.setNum++;
        speak(`Set ${S.guided.setNum} of ${S.guided.setsTarget}. Get ready.`);
        setTimeout(() => {
          if(S.guided?.active) startGuidedSet();
        }, 2000);
      }
      const el = document.getElementById('guided-counter');
      if(el) el.textContent = S.guided.secsLeft;
    }, 1000);
    render();
    return;
  }
  // All sets done — mark exercise complete, move to next
  const curEx = exList[S.guided.exIdx];
  if(curEx && !S.doneEx.includes(curEx.name)) {
    S.doneEx.push(curEx.name);
    LS.set('done_ex_' + S.date, S.doneEx);
  }
  // Next exercise?
  if(S.guided.exIdx + 1 >= exList.length) {
    // Circuit complete
    speak("Circuit complete. Excellent work.", true);
    S.guided.phase = 'done';
    persist();
    render();
    return;
  }
  // Rest between exercises
  S.guided.phase = 'rest_ex';
  S.guided.secsLeft = REST_BETWEEN_EX;
  const nextEx = exList[S.guided.exIdx + 1];
  speak(`Exercise complete. Rest ${REST_BETWEEN_EX} seconds. Next up: ${nextEx.name}.`);
  S.guided.timerId = setInterval(() => {
    S.guided.secsLeft--;
    if([10,5,4,3,2,1].includes(S.guided.secsLeft)) speak(String(S.guided.secsLeft));
    if(S.guided.secsLeft <= 0) {
      stopGuidedTimer();
      S.guided.exIdx++;
      const ex2 = exList[S.guided.exIdx];
      S.guided.setNum = 1;
      S.guided.repsTarget = parseReps(ex2.reps);
      S.guided.setsTarget = parseSets(ex2.sets);
      S.guided.pace = getExPace(ex2.name);
      speak(`${ex2.name}. ${S.guided.setsTarget} sets of ${S.guided.repsTarget} reps.`);
      setTimeout(() => {
        if(S.guided?.active) startGuidedSet();
      }, 2500);
    }
    const el = document.getElementById('guided-counter');
    if(el) el.textContent = S.guided.secsLeft;
  }, 1000);
  render();
}

function guidedSkip() {
  if(!S.guided) return;
  stopGuidedTimer();
  if('speechSynthesis' in window) speechSynthesis.cancel();
  speak("Skipping.", true);
  guidedSetComplete();
}

function guidedPause() {
  if(!S.guided?.timerId) return;
  stopGuidedTimer();
  S.guided.paused = true;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  render();
}

function guidedResume() {
  if(!S.guided?.paused) return;
  S.guided.paused = false;
  // Resume based on phase
  if(S.guided.phase === 'counting') startGuidedSet();
  else guidedSetComplete();
}

    return `<div class="card" style="text-align:center;background:linear-gradient(135deg,#1B5E20,#2E7D32);color:#fff;padding:40px 20px;min-height:60vh;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:64px;margin-bottom:16px">🎉</div>

                    isTimed ? g.secsLeft :

        <div style="font-size:11px;color:#80CBC4">SET ${g.setNum}/${g.setsTarget}</div>
      </div>

    <!-- Progress bar -->
    <div style="height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin-bottom:24px">
      <div style="height:100%;width:${Math.round(progress)}%;background:#80CBC4;border-radius:2px;transition:width .3s"></div>
    </div>

    <!-- Exercise name + tip -->
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:42px;margin-bottom:6px">${ex.icon}</div>
      <div style="font-size:22px;font-weight:700;margin-bottom:6px">${isRest && g.phase === 'rest_ex' ? `Next: ${exList[g.exIdx + 1]?.name || ex.name}` : ex.name}</div>
      <div style="font-size:11px;color:rgba(255,255,255,.55);line-height:1.4;max-width:320px;margin:0 auto;padding:0 16px">${ex.tip}</div>
    </div>

    <!-- BIG COUNTER -->
    <div style="text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;margin:20px 0">
      <div id="guided-counter" style="font-size:120px;font-weight:700;color:${isRest?'#90CAF9':'#4DB6AC'};font-family:var(--mono);line-height:1;letter-spacing:-4px">${isReady ? '...' : bigNumber}</div>

        : `<button onclick="guidedPause()" style="flex:1;padding:12px;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:12px;font-size:13px">⏸ Pause</button>`

}

    <div style="text-align:center;margin-bottom:20px">

      </div>

// --- FASTING --------------------------------------------------------
// S.day.fasting    = bool, is timer running right now
// S.day.fastStart  = Date.now() of current session start
// S.day.fastBest   = best continuous seconds achieved today (saved on stop)
// S.fastElapsed    = live seconds of current session (display only)

function startTimer() {
  if(S.fastTimer) clearInterval(S.fastTimer);
  if(S.day.fasting && S.day.fastStart) {
    S.fastTimer = setInterval(()=>{
      S.fastElapsed = Math.floor((Date.now()-S.day.fastStart)/1000);
      tickTimer();
    },1000);
  }
}
function tickTimer() {

function rebuildHistory() {
  const prefix = 'hlog_';
  const entries = [];
  for(let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if(!key.startsWith(prefix)) continue;
    const date = key.slice(prefix.length);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    const day = LS.get(key, null);
    if(!day) continue;
    const t = sumMacros(day.entries || []);
    entries.push({

      protein:     Math.round(t.protein || 0),
      carbs:       Math.round(t.carbs   || 0),
      fat:         Math.round(t.fat     || 0),

function addFood(food,qty) {
  const sc=scale(food,qty); sc.cal=sc.cal||kcal(sc);
  // Use manually entered time if set, otherwise now
  let ts = Date.now();
  let targetDate = S.date;
  if(S.logTime) {
    const [hh,mm] = S.logTime.split(':').map(Number);
    const d = new Date(); d.setHours(hh, mm, 0, 0);
    // If entered time is in the future (e.g. logging yesterday evening), step back
    if(d.getTime() > Date.now()) d.setDate(d.getDate()-1);
    ts = d.getTime();
    // If timestamp falls on a different day, target that day's log
    const tsDate = new Date(ts).toISOString().split('T')[0];
    if(tsDate !== S.date) targetDate = tsDate;
  }
  const entry = {id:Date.now(),name:food.name,qty,...sc,ts};
  // If entry belongs to a past day, save it there instead
  if(targetDate !== S.date) {
    const pastDay = loadDay(targetDate);
    pastDay.entries.push(entry);
    saveDay(targetDate, pastDay);
    S.sel=null; S.srch=''; S.qty=1; S.logTime=''; persist(); render();
    return;
  }
  // Confirmation before breaking fast — use in-app modal (confirm() blocked in PWA)
  if((sc.cal||0) >= 20 && S.day.fasting) {
    const stopTs = Math.max(ts, Date.now());
    const startTs = S.day.fastStart || stopTs;
    const elapsed = Math.floor((stopTs - startTs) / 1000);
    const hrs = Math.floor(elapsed/3600), mins = Math.floor((elapsed%3600)/60);
    const elapsedStr = hrs > 0 ? hrs+'h '+mins+'m' : mins+'m';
    showFastBreakModal(food, qty, entry, elapsed, elapsedStr);
    return; // modal handles the rest
  }
  S.day.entries.push(entry);
  S.sel=null; S.srch=''; S.qty=1; S.logTime=''; persist(); render();
}

// Build a plan object with any swapped meals applied
function effectivePlanObj(isTmr=false) {
  const p = isTmr ? tmrPlan() : todayPlan();
  const m0 = isTmr ? (S.tmrSwappedM0 || p.meals?.[0]) : (S.swappedM0 || p.meals?.[0]);
  const m1 = isTmr ? (S.tmrSwappedM1 || p.meals?.[1]) : (S.swappedM1 || p.meals?.[1]);
  const meals = [m0, m1].filter(Boolean);
  // Rebuild grocery — strip quantity prefixes, deduplicate by ingredient, aggregate qtys
  const map = new Map();
  const stripQty = str => str
    .replace(/^\d[\d½¼¾\/\s]*\s*(ग्राम|gram|g|tsp|tbsp|छोटे?\s*चम्मच|टेबलस्पून|पूरे|whole|slice|ml|kg)\s*/i,'')
    .replace(/^(छोटे?\s*चम्मच|टेबलस्पून|ग्राम)\s*/i,'')
    .replace(/^\d+\s*/,'')
    .replace(/\s*—\s*(क्यूब्स|cubes|कद्दूकस|grated|साइड.*|for the.*|optional|वैकल्पिक.*)$/i,'')
    .replace(/\(.*?\)/g,'')
    .trim();

  meals.forEach(m => (m.ingredients||[]).forEach(i => {
    const key = stripQty(i.en).toLowerCase();
    const cleanHi = stripQty(i.hi);
    const cleanEn = stripQty(i.en);
    if(map.has(key)) {
      const prev = map.get(key);
      const prevNum = parseFloat(prev.qty);
      const curNum  = parseFloat(i.qty);
      if(!isNaN(prevNum) && !isNaN(curNum)) {
        const unit = (i.qty+'').replace(/^[\d.]+\s*/,'').trim();
        map.set(key, { ...prev, qty: (prevNum+curNum) + (unit ? ' '+unit : '') });
      }
    } else {
      map.set(key, { hi: cleanHi, en: cleanEn, qty: i.qty });
    }
  }));
  const grocery = Array.from(map.values());
  const totals = {
    protein: meals.reduce((a,m)=>a+(m.protein||0),0),
    carbs:   meals.reduce((a,m)=>a+(m.carbs||0),0),
    fat:     meals.reduce((a,m)=>a+(m.fat||0),0),
    cal:     meals.reduce((a,m)=>a+(m.cal||0),0),
  };
  return { ...p, meals, grocery, totals };
}

function copyText(text, flagKey) {
  // Try modern clipboard API first, fallback to textarea trick
  const finish = () => { S[flagKey]=true; render(); setTimeout(()=>{S[flagKey]=false;render();},2500); };
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish).catch(() => {
      fallbackCopy(text); finish();
    });
  } else {
    fallbackCopy(text); finish();
  }
}

  const ta = document.createElement('textarea');
  ta.value = text;

  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
}

      t += `📦 *सामग्री*\n`;

        if(i.qty && i.qty !== '') {
          t += `  ${i.qty.padEnd(8)} ${i.hi.split('—')[0].trim()}\n`;
        }
      });
      t += `\n`;
    }

    // Steps — numbered, Hindi only, one line each
    if(m.steps?.length) {
      t += `👨‍🍳 *तरीका*\n`;
      m.steps.forEach((s, si) => {
        t += `${si+1}. ${s.hi}\n`;
      });
    }

    t += `\n`;
  });

  // Shake reminder
  if(p.shake) {
    t += `${line}\n`;
    t += `🥤 *व्हे शेक — 4:00 PM*\n`;
    t += `1 scoop Isopure + 300ml ठंडा पानी\n\n`;
  }

  // Rules — compact
  t += `${line}\n`;
  t += `⚠️ *ज़रूरी*\n`;
  t += `❌ तेल नहीं — घी/मक्खन ही\n`;
  if(S.diet==='keto') t += `❌ चावल / रोटी / दाल नहीं\n`;
  t += `❌ चीनी नहीं\n`;
  t += `✅ सब्ज़ी परिवार के खाने से साथ में\n\n`;

  // Nutrition — one line
  t += `📊 P:${p.totals.protein}g  C:${p.totals.carbs}g  ${p.totals.cal} kcal  _(+ shake: P:25g, 110 kcal)_`;

  return t;
}

    <svg width="${size}" height="${size}">

function renderProteinWarning(eaten, target) {
  const pct = Math.round(eaten / target * 100);
  const remaining = Math.round(target - eaten);
  const hr = new Date().getHours();
  if (pct >= 80 || hr < 15) return '';
  const color = pct < 40 ? '#C62828' : '#E65100';
  const bg    = pct < 40 ? '#FFEBEE' : '#FFF3E0';
  const icon  = pct < 40 ? '🚨' : '⚠️';
  const msg   = pct < 40
    ? 'Only ' + eaten + 'g protein so far — you need ' + remaining + 'g more today. Without enough protein, your body will break down muscle instead of fat.'
    : eaten + 'g protein so far — ' + remaining + 'g still needed. Add eggs, paneer or whey shake to hit your target.';
  return '<div style="background:' + bg + ';border-left:4px solid ' + color + ';border-radius:10px;padding:12px 14px;margin-bottom:4px">'
    + '<div style="font-size:13px;font-weight:700;color:' + color + ';margin-bottom:4px">' + icon + ' Protein ' + pct + '% of target</div>'
    + '<div style="font-size:12px;color:#555;line-height:1.5">' + msg + '</div>'
    + '<button onclick="S.tab=\'log\';render()" style="margin-top:8px;padding:6px 14px;background:' + color + ';color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700">+ Log Protein Food</button>'
    + '</div>';
}

async function nixSearch(q) {
  // USDA FoodData Central — free, no API key needed
  S.nixSearching = true; S.nixResults = []; repaintList();
  try {
    const url = 'https://api.nal.usda.gov/fdc/v1/foods/search?query='
      + encodeURIComponent(q)
      + '&pageSize=15&api_key=DEMO_KEY';
    const res = await fetch(url);
    if(res.status === 429) { alert('USDA rate limit reached (30 searches/hour free). Try again in a few minutes.'); S.nixSearching=false; repaintList(); return; }
    if(!res.ok) { alert('USDA search error: ' + res.status + '. Check internet connection.'); S.nixSearching=false; repaintList(); return; }
    const data = await res.json();
    const hits = (data.foods || []).slice(0, 12);
    if(hits.length===0) { alert('No results found for "'+q+'" in USDA database. Try a simpler term.'); S.nixSearching=false; repaintList(); return; }
    S.nixResults = hits.map(h => {
      const get = (n) => {
        const nut = (h.foodNutrients||[]).find(x => x.nutrientName === n);
        return nut ? +nut.value.toFixed(1) : 0;
      };
      const p   = get('Protein');
      const c   = +(Math.max(0, get('Carbohydrate, by difference') - get('Fiber, total dietary'))).toFixed(1);
      const f   = get('Total lipid (fat)');
      const cal = Math.round(get('Energy')) || Math.round(p*4 + c*4 + f*9);
      const srv = h.servingSize ? ' ('+h.servingSize+(h.servingSizeUnit||'g')+')' : ' (100g)';
      return {
        name: (h.description||'').slice(0,60) + srv,
        protein: p, carbs: c, fat: f, cal,
        category: 'USDA'
      };
    }).filter(f => f.cal > 0);
  } catch(e) {
    S.nixResults = [];
    alert('USDA search failed — ' + e.message + '. Check internet connection.');
  }
  S.nixSearching = false; repaintList();
}

}
function pickFood(name, fromNix) {
  let f;
  if(fromNix) {
    f = S.nixResults.find(x=>x.name===name);

  S.sel = S.sel?.name===name ? null : f; S.qty=1;

function fastHistoryCard() {
  const days = [];
  for(let i=1; i<=14; i++) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const dayObj = LS.get('hlog_'+ds, null);
    const histObj = (S.hist||[]).find(h=>h.date===ds);
    const fb = dayObj?.fastBest || histObj?.fastBest || 0;
    if(fb > 0 || i <= 7) days.push({ date:ds, fastBest:fb });
  }
  days.reverse();
  const chartDays = days.slice(-7);
  const yday = days[days.length-2];
  const yFast = yday?.fastBest || 0;
  const yHrs = (yFast/3600).toFixed(1);
  const yReached = yFast >= 19*3600;
  const withData = days.filter(d=>d.fastBest>0);
  const avg7 = withData.length ? withData.reduce((a,d)=>a+d.fastBest,0)/withData.length : 0;
  const avg7h = (avg7/3600).toFixed(1);

  const ybg  = yFast>0 ? (yReached?'#E8F5E9':'var(--lt-teal)') : '#F5F5F5';
  const ybd  = yFast>0 ? (yReached?'#A5D6A7':'#B2DFDB') : '#EEE';
  const ycol = yFast>0 ? (yReached?'var(--green)':'var(--teal)') : '#CCC';
  const ysub = yReached ? '<div style="font-size:10px;color:var(--green)">✓ Target met</div>'
             : yFast>0  ? '<div style="font-size:10px;color:var(--muted)">Target: 19h</div>'
                        : '<div style="font-size:10px;color:#CCC">No data</div>';

  let out = '<div style="display:flex;gap:10px;margin-bottom:16px">';
  out += '<div style="flex:1;padding:12px;background:'+ybg+';border-radius:12px;border:1px solid '+ybd+'">';
  out += '<div style="font-size:10px;color:#888;margin-bottom:4px">Yesterday</div>';
  out += '<div style="font-size:20px;font-weight:700;color:'+ycol+'">'+(yFast>0?yHrs+'h':'—')+'</div>'+ysub+'</div>';
  out += '<div style="flex:1;padding:12px;background:'+(avg7>0?'var(--lt-teal)':'#F5F5F5')+';border-radius:12px;border:1px solid '+(avg7>0?'#B2DFDB':'#EEE')+'">';
  out += '<div style="font-size:10px;color:#888;margin-bottom:4px">7-day avg</div>';
  out += '<div style="font-size:20px;font-weight:700;color:'+(avg7>0?'var(--teal)':'#CCC')+'">'+(avg7>0?avg7h+'h':'—')+'</div>';
  out += '<div style="font-size:10px;color:var(--muted)">'+withData.length+' day'+(withData.length!==1?'s':'')+' tracked</div></div></div>';

  if(chartDays.some(d=>d.fastBest>0)) {
    const maxSecs = Math.max(...chartDays.map(d=>d.fastBest), 19*3600);
    out += '<div style="font-size:11px;color:var(--muted);margin-bottom:8px">Last 7 days</div>';
    out += '<div style="display:flex;gap:4px;align-items:flex-end;height:80px;margin-bottom:6px">';
    chartDays.forEach(d => {
      const h = (d.fastBest/3600).toFixed(1);
      const pct = d.fastBest ? Math.round(d.fastBest/maxSecs*100) : 0;
      const col = d.fastBest >= 19*3600 ? 'var(--green)' : d.fastBest >= 16*3600 ? 'var(--teal)' : d.fastBest >= 12*3600 ? 'var(--gold)' : d.fastBest>0 ? '#E53935' : '#EEE';
      const dayLbl = new Date(d.date+'T12:00:00').toLocaleDateString('en-IN',{weekday:'short'});
      out += '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;flex:1">';
      out += '<div style="font-size:8px;color:var(--muted)">'+(d.fastBest?h+'h':'')+'</div>';
      out += '<div style="width:100%;height:'+pct+'%;min-height:'+(d.fastBest?3:0)+'px;background:'+col+';border-radius:3px 3px 0 0"></div>';
      out += '<div style="font-size:8px;color:var(--muted)">'+dayLbl+'</div></div>';
    });
    out += '</div>';
    out += '<div style="display:flex;gap:10px;flex-wrap:wrap">';
    out += '<span style="font-size:10px;color:#888">🟢 ≥19h &nbsp; 🔵 ≥16h &nbsp; 🟡 ≥12h &nbsp; 🔴 &lt;12h</span>';
    out += '</div>';
  } else {
    out += '<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">No fasting history yet — data builds up over time</div>';
  }
  return out;
}

function tabFast() {
  const R=85, C=2*Math.PI*R;
  const best = S.day.fastBest || 0;
  const display = S.day.fasting ? S.fastElapsed : best;
  const pct = Math.min(display/3600/19, 1);
  const reached = display >= 19*3600;
  const bestReached = best >= 19*3600;

  return `
    <div class="card" style="text-align:center">
      <div class="sec">Fasting Timer</div>
      <svg width="200" height="200" style="display:block;margin:0 auto 16px">
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="#E0F2F1" stroke-width="14"/>
        <circle id="fa" cx="100" cy="100" r="${R}" fill="none"
          stroke="${reached?'#66BB6A':'var(--teal)'}" stroke-width="14"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"
          stroke-linecap="round" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset 1s linear"/>
        <text id="ft" x="100" y="88" text-anchor="middle" fill="var(--dark)" font-size="26" font-weight="700" font-family="Georgia,serif">${hms(display)}</text>
        <text x="100" y="108" text-anchor="middle" fill="#888" font-size="11" font-family="Georgia,serif">${S.day.fasting?'current session':best>0?'best session today':'of 19h target'}</text>
        <text x="100" y="124" text-anchor="middle" fill="${S.day.fasting?'var(--teal)':'#BBB'}" font-size="10" font-family="Georgia,serif">${S.day.fasting?'fasting — tap to stop':best>0?'tap to start new session':'tap to start'}</text>
      </svg>

      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="toggleFast()" style="padding:13px 34px;background:${S.day.fasting?'var(--red)':'var(--teal)'};color:#fff;border:none;border-radius:30px;font-size:15px;font-weight:700">
          ${S.day.fasting?'⏹ Stop Fast':best>0?'▶ New Session':'▶ Start Fast'}
        </button>
        ${best>0||S.day.fasting?`<button onclick="resetFast()" style="padding:13px 14px;background:#F5F5F5;color:#AAA;border:none;border-radius:30px;font-size:13px">↺</button>`:''}
      </div>

          ${!S.day.fasting && S.day.entries.filter(e=>e.ts&&(e.cal||0)>=20).length>0 ? `
      <div style="margin-top:12px;text-align:center">
        <button onclick="autoStartFastFromLastEntry()" style="padding:9px 20px;background:var(--lt-teal);color:var(--teal);border:1.5px solid var(--teal);border-radius:20px;font-size:12px;font-weight:700">
          ⏱ Start fast from last meal (${fmtTime(S.day.entries.filter(e=>e.ts&&(e.cal||0)>=20).sort((a,b)=>b.ts-a.ts)[0].ts)})
        </button>
      </div>`:''}

      ${reached?'<div style="margin-top:14px;font-size:14px;color:var(--green);font-weight:700">🎉 19-hour target reached!</div>':''}

      ${!S.day.fasting ? `<div style="margin-top:12px;padding:10px 14px;background:#1a1a1a;border-radius:12px;border:1px dashed #444">
        <div style="font-size:11px;color:#aaa;margin-bottom:8px;text-align:center">🕐 Set custom fast start time</div>
        <div style="display:flex;align-items:center;gap:8px;justify-content:center">
          <input type="time" id="custom-fast-time" style="padding:6px 10px;border:1.5px solid var(--teal);border-radius:8px;font-size:14px;font-weight:700;background:#222;color:#fff"/>
          <button onclick="
            const el=document.getElementById('custom-fast-time');
            const t=el?el.value:'';
            if(t){
              const [h,m]=t.split(':').map(Number);
              const now=new Date();
              let start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m,0,0);
              if(start>now) start.setDate(start.getDate()-1);
              S.day.fasting=true;
              S.day.fastStart=start.getTime();
              saveDay(isoToday(),S.day);
              startTimer();
              render();
            }" style="padding:7px 16px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700">
            Start
          </button>
        </div>
        <div style="font-size:10px;color:#666;text-align:center;margin-top:6px">Enter yesterday's time if fast started before midnight</div>
      </div>` : ''}

      ${best>0?`
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">

const LFT_TESTS = [
  { id:'lft',  label:'🩸 LFT (Liver Function Test)', reason:'Saroglitazar monitoring', freq:90 },
  { id:'lipid',label:'🩸 Lipid Profile',              reason:'Cholesterol + triglycerides on keto', freq:90 },
  { id:'hba1c',label:'🩸 HbA1c',                      reason:'Blood sugar trend — Ozempic efficacy', freq:90 },
  { id:'rft',  label:'🩸 RFT (Kidney Function)',       reason:'Olmesartan monitoring', freq:90 },
  { id:'vitd', label:'🩸 Vitamin D3 Level',            reason:'Supplement dose calibration', freq:180 },
  { id:'b12',  label:'🩸 Vitamin B12 Level',           reason:'Supplement dose calibration', freq:180 },
];

function getLastTest(id)  { return LS.get('lft_last_'+id, null); }
function logTest(id) {
  if(!confirm('Mark this test as done today?')) return;
  LS.set('lft_last_'+id, Date.now());
  render();
}
function clearTest(id) {
  if(!confirm('Clear this test date?')) return;
  LS.set('lft_last_'+id, null);
  render();
}
function daysSinceTs(ts) { return ts ? Math.floor((Date.now()-ts)/86400000) : null; }
function daysUntil(ts, freq) {
  if(!ts) return 0;
  return Math.max(0, freq - Math.floor((Date.now()-ts)/86400000));
}

function lftCard() {
  const overdue = LFT_TESTS.filter(t => {
    const last = getLastTest(t.id);
    return !last || daysSinceTs(last) >= t.freq;
  });

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <div class="sec" style="margin:0">🧪 Blood Tests</div>
      ${overdue.length>0?`<div style="background:var(--red);color:#fff;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:700">${overdue.length} due</div>`:'<div style="background:var(--green);color:#fff;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:700">All up to date ✓</div>'}
    </div>
    <div style="font-size:11px;color:#888;margin-bottom:14px">Tap ✓ Done when you've had the test</div>
    ${LFT_TESTS.map(t => {
      const last = getLastTest(t.id);
      const days = daysSinceTs(last);
      const left = daysUntil(last, t.freq);
      const isDue = !last || days >= t.freq;
      const isSoon = !isDue && left <= 14;
      const statusColor = isDue ? 'var(--red)' : isSoon ? 'var(--gold)' : 'var(--green)';
      const statusText = !last ? 'Never done' : isDue ? `Overdue — ${days}d ago` : isSoon ? `Due in ${left} days` : `Due in ${left} days`;
      const lastText = last ? `Last: ${new Date(last).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}` : '';
      return `<div style="padding:11px 0;border-bottom:1px solid #F5F5F5">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;color:var(--dark)">${t.label}</div>
            <div style="font-size:11px;color:#888;margin-top:1px">${t.reason}</div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
              <span style="font-size:11px;font-weight:700;color:${statusColor}">${statusText}</span>
              ${lastText?`<span style="font-size:10px;color:#BBB">${lastText}</span>`:''}
            </div>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button onclick="logTest('${t.id}')" style="padding:6px 12px;background:${isDue?'var(--green)':'#E8F5E9'};color:${isDue?'#fff':'var(--green)'};border:none;border-radius:8px;font-size:12px;font-weight:700">✓ Done</button>
            ${last?`<button onclick="clearTest('${t.id}')" style="padding:6px 8px;background:#FFEBEE;color:var(--red);border:none;border-radius:8px;font-size:11px">✕</button>`:''}
          </div>
        </div>
        ${!isDue?`<div style="margin-top:6px;height:4px;background:#EEE;border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${Math.min(100,Math.round((t.freq-left)/t.freq*100))}%;background:${isSoon?'var(--gold)':'var(--teal)'};border-radius:2px"></div>
        </div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

// --- ANALYTICS HELPERS -------------------------------------------

function movingAvg(hist, n=7) {
  // 7-day moving average of weight from history (oldest first)
  const weighted = hist.filter(d => d.weight).slice(0, 30).reverse();
  if(weighted.length < 2) return [];
  return weighted.map((d, i) => {
    const window = weighted.slice(Math.max(0, i-n+1), i+1).filter(x=>x.weight);
    const avg = window.reduce((s,x)=>s+x.weight,0)/window.length;
    return { date: d.date, avg: +avg.toFixed(2) };
  });
}

function adaptiveTDEE(hist) {
  // MacroFactor-style 5-step metabolic engine

  // Step 1 — Collect days with weight, sorted oldest→newest
  // Use all weight days for trend, but only days with calories for TDEE
  const allW = hist.filter(d => d.weight).slice(0, 60).reverse();
  const calDays = hist.filter(d => d.weight && d.cal > 0).slice(0, 60).reverse();

  if(allW.length < 3) return { tdee: null, confidence: 0, days: allW.length };

  // Step 2 — Smooth body weight with 7-day simple moving average
  // Removes water / sodium / glycogen noise
  const trendWeight = allW.map((d, i) => {
    const window = allW.slice(Math.max(0, i - 6), i + 1);
    const avg = window.reduce((s, x) => s + x.weight, 0) / window.length;
    return { date: d.date, weight: avg };
  });

  // Step 3 — Regression slope on smoothed weight (kg/day)
  // Least-squares linear regression gives more stable slope than first/last point
  const n = trendWeight.length;
  const t0 = new Date(trendWeight[0].date).getTime();
  const xs = trendWeight.map(d => (new Date(d.date).getTime() - t0) / 86400000); // days from start
  const ys = trendWeight.map(d => d.weight);
  const xMean = xs.reduce((a, b) => a + b, 0) / n;
  const yMean = ys.reduce((a, b) => a + b, 0) / n;
  const ssXY = xs.reduce((s, x, i) => s + (x - xMean) * (ys[i] - yMean), 0);
  const ssXX = xs.reduce((s, x) => s + (x - xMean) ** 2, 0);
  const slopeKgPerDay = ssXX > 0 ? ssXY / ssXX : 0; // kg/day (negative = losing)

  // Step 4 — Convert slope to energy imbalance per day
  const energyChangePerDay = slopeKgPerDay * 7700; // kcal/day

  // Step 5 — Maintenance estimate from calorie days
  // maintenanceEstimate = avgCalories - energyChangePerDay
  // (if losing weight, energyChangePerDay is negative, so maintenance > intake)
  if(calDays.length < 3) return { tdee: null, confidence: 0, days: allW.length };

  const avgCal = calDays.reduce((s, d) => s + d.cal, 0) / calDays.length;
  const rawMaintenance = avgCal - energyChangePerDay;

  // Step 6 — Smooth the maintenance estimate over time using EMA
  // This is the critical step: TDEE = prevTDEE * 0.9 + newEstimate * 0.1
  // We simulate this by computing per-week maintenance estimates and smoothing them
  const weeklyEstimates = [];
  for(let i = 6; i < calDays.length; i++) {
    const window = calDays.slice(i - 6, i + 1);
    const wAvgCal = window.reduce((s, d) => s + d.cal, 0) / window.length;
    // Get smoothed weight slope for this window
    const wDates = window.map(d => (new Date(d.date).getTime() - t0) / 86400000);
    const wWeights = window.map(d => {
      const tw = trendWeight.find(t => t.date === d.date);
      return tw ? tw.weight : d.weight;
    });
    const wxMean = wDates.reduce((a,b) => a+b, 0) / window.length;
    const wyMean = wWeights.reduce((a,b) => a+b, 0) / window.length;
    const wssXY = wDates.reduce((s,x,i) => s + (x-wxMean)*(wWeights[i]-wyMean), 0);
    const wssXX = wDates.reduce((s,x) => s + (x-wxMean)**2, 0);
    const wSlope = wssXX > 0 ? wssXY / wssXX : 0;
    const estimate = Math.round(wAvgCal - wSlope * 7700);
    if(estimate >= 1000 && estimate <= 6000) weeklyEstimates.push(estimate);
  }

  // If not enough windowed data, fall back to global estimate
  const estimates = weeklyEstimates.length >= 1 ? weeklyEstimates : [Math.round(rawMaintenance)];

  // Apply EMA smoothing: TDEE = prevTDEE * 0.9 + newEstimate * 0.1
  let smoothedTDEE = estimates[0];
  for(let i = 1; i < estimates.length; i++) {
    smoothedTDEE = smoothedTDEE * 0.9 + estimates[i] * 0.1;
  }

  // Sanity check
  if(smoothedTDEE < 1000 || smoothedTDEE > 6000) {
    smoothedTDEE = Math.round(rawMaintenance);
  }

  const confidence = allW.length >= 21 ? 3
                   : allW.length >= 14 ? 2
                   : allW.length >= 7  ? 1
                   : 0;

  return {
    tdee: Math.round(smoothedTDEE),
    slopeKgPerWeek: Math.round(slopeKgPerDay * 7 * 100) / 100,
    avgCal: Math.round(avgCal),
    confidence,
    days: allW.length
  };
}

function analyticsData(hist) {
  // Compute all metabolic analytics from history
  const wData = hist.filter(d => d.weight).slice(0, 30).reverse(); // oldest→newest
  if(wData.length < 3) return null;

  const latest = wData[wData.length-1].weight;
  const oldest = wData[0].weight;
  // Use actual date span in days, not entry count
  const firstDate = new Date(wData[0].date);
  const lastDate = new Date(wData[wData.length-1].date);
  const daySpan = Math.max(1, Math.round((lastDate - firstDate) / (1000*60*60*24)));
  const totalLost = oldest - latest;
  const ratePerDay = totalLost / Math.max(daySpan, 1);
  const ratePerWeek = ratePerDay * 7;

  // Water-weight corrected deficit (first 14 days keto = mostly water)
  const fatFraction = daySpan < 14 ? 0.3 : daySpan < 21 ? 0.6 : 1.0;
  const deficitPerDay = Math.round(ratePerDay * 7700 * fatFraction);

  // Simple maintenance = avg intake + corrected deficit
  const calDays = hist.filter(d=>d.cal>0).slice(0,14);
  const avgCal = calDays.length ? Math.round(calDays.reduce((s,d)=>s+d.cal,0)/calDays.length) : 0;
  const maintenance = avgCal > 0 ? Math.round(avgCal + deficitPerDay) : 0;

  // Adaptive TDEE
  const adaptive = adaptiveTDEE(hist);

  // Goal prediction — use adaptive TDEE if available, else simple rate
  const goalW = LS.get('goal_weight', 80);
  const remaining = Math.max(0, latest - goalW);
  const daysToGoal = ratePerDay > 0.001 ? Math.round(remaining / ratePerDay) : null;
  let goalDateStr = null;
  if(daysToGoal !== null) {
    const gd = new Date(); gd.setDate(gd.getDate() + daysToGoal);
    goalDateStr = gd.toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'});
  }

  // Status assessment
  let status, statusColor, statusMsg;
  const absRate = Math.abs(ratePerWeek);
  if(totalLost <= 0) {
    status = '⚠️ Stalled'; statusColor = '#F57F17';
    statusMsg = 'Weight not moving. Check portion sizes and reduce carbs.';
  } else if(absRate > 1.5 && wData.length >= 14) {
    status = '⚡ Too Fast'; statusColor = '#C62828';
    statusMsg = `Losing ${ratePerWeek.toFixed(2)}kg/week. Increase calories by ~200 to protect muscle.`;
  } else if(absRate > 1.5 && wData.length < 14) {
    status = '💧 Water Weight'; statusColor = '#1565C0';
    statusMsg = `Early loss of ${ratePerWeek.toFixed(2)}kg/week is normal — mostly water from keto. Re-assessed after 2 weeks.`;
  } else if(absRate >= 0.3 && absRate <= 1.0) {
    status = '✅ On Track'; statusColor = '#2E7D32';
    statusMsg = `Steady loss of ${ratePerWeek.toFixed(2)}kg/week. Keep going.`;
  } else if(absRate > 1.0 && absRate <= 1.5) {
    status = '✅ Good Pace'; statusColor = '#1565C0';
    statusMsg = `${ratePerWeek.toFixed(2)}kg/week — excellent, sustainable rate.`;
  } else {
    status = '🐌 Slow'; statusColor = '#F57F17';
    statusMsg = `Only ${ratePerWeek.toFixed(2)}kg/week. Tighten carbs or add fasted walk.`;
  }

  return { latest, oldest, totalLost, ratePerDay, ratePerWeek, deficitPerDay,
           avgCal, maintenance, adaptive, goalW, remaining, daysToGoal, goalDateStr,
           status, statusColor, statusMsg, wDataLen: wData.length };
}

function loggingStreak(hist) {
  // Consecutive days (today backward) with at least 1 food logged
  if(!hist.length) return 0;
  let streak = 0;
  const today = isoToday();
  // hist is newest-first
  for(let i = 0; i < hist.length; i++) {
    const d = hist[i];
    // Allow today to count even if cal=0 (still in progress)
    if(i === 0 && d.date === today) { streak++; continue; }
    if(d.cal > 0 || d.protein > 0) streak++;
    else break;
  }
  return streak;
}

function dayComplete(dayData) {
  // 90–110% calories AND >=80% protein target
  if(!dayData) return false;
  const tg = tgt();
  const t = sumMacros(dayData.entries || []);
  const calOk = t.cal >= tg.cal * 0.9 && t.cal <= tg.cal * 1.15;
  const protOk = t.protein >= tg.protein * 0.8;
  return calOk && protOk;
}

function exportCSV() {
  const h = S.hist;
  if(!h.length) { alert('No history to export yet.'); return; }
  const rows = [['Date','Protein(g)','Carbs(g)','Fat(g)','Calories','Weight(kg)','Water(L)','Fasting(h)','Workout']];
  h.forEach(d => {
    const fast = d.fastBest ? (d.fastBest/3600).toFixed(1) : '';
    rows.push([d.date, Math.round(d.protein||0), Math.round(d.carbs||0), Math.round(d.fat||0),
      Math.round(d.cal||0), d.weight||'', d.water||'', fast, d.workoutDone?'Yes':'No']);
  });
  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nytyn_health_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

    : '';
  return '<div style="background:#EDE7F6;border-radius:10px;padding:12px;margin-bottom:12px">'

    + '<span style="font-size:10px;background:' + confBgs[ci] + ';color:' + confColors[ci] + ';border-radius:20px;padding:2px 8px;font-weight:700">' + confLabels[ci] + '</span>'
    + '</div>'
    + '<div style="display:flex;align-items:baseline;gap:6px;margin-bottom:6px">'
    + '<div style="font-size:28px;font-weight:700;color:#6A1B9A">' + ad.tdee + '</div>'
    + '<div style="font-size:12px;color:#888">kcal/day · based on ' + ad.days + ' days</div>'
    + (ad.slopeKgPerWeek !== undefined ? '<div style="font-size:11px;color:#888;margin-top:2px">Regression slope: ' + (ad.slopeKgPerWeek <= 0 ? '' : '+') + ad.slopeKgPerWeek + ' kg/week · avg intake ' + ad.avgCal + ' kcal/day</div>' : '')
    + '</div>'
    + '<div style="font-size:11px;color:#555;line-height:1.5">EMA-smoothed from your actual intake + weight change data. ' + confMsg + '</div>'
    + targetRow
    + '</div>';
}

function metabolicCard(hist) {
  const a = analyticsData(hist);
  const startW = LS.get('start_weight', 116);
  const goalW  = LS.get('goal_weight', 80);
  // Use earliest logged weight as start, latest as current
  const weightEntries = hist.filter(d=>d.weight).sort((a,b)=>a.date.localeCompare(b.date));
  const firstLoggedW = weightEntries.length ? weightEntries[0].weight : startW;
  const currentW = weightEntries.length ? weightEntries[weightEntries.length-1].weight : startW;
  const effectiveStart = weightEntries.length ? firstLoggedW : startW; // always use first logged weight
  const totalJourney = effectiveStart - goalW;
  const doneSoFar = effectiveStart - currentW;
  const pct = totalJourney > 0 ? Math.min(100, Math.round(doneSoFar / totalJourney * 100)) : 0;

  // Progress bar always shows even without enough data
  const progressBar = `
    <div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:12px;font-weight:700;color:var(--dark)">Goal Progress</span>

      </div>

        <span style="font-size:10px;color:#aaa">Start: ${effectiveStart}kg</span>

  if(!a) return `<div class="card">
    <div class="sec">📊 Metabolic Feedback</div>
    ${progressBar}

  const ma = movingAvg(hist, 7);
  const maLine = ma.length >= 2 ? (() => {
    const vals = ma.map(d=>d.avg);
    const mn = Math.min(...vals) - 0.3, mx = Math.max(...vals) + 0.3;
    const W=400, H=60, xs=W/Math.max(vals.length-1,1);
    const pts = vals.map((v,i)=>[i*xs, H-((v-mn)/(mx-mn))*H]);
    const path = pts.map((p,i)=>`${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    return `<div style="margin-bottom:12px">
      <div style="font-size:11px;font-weight:700;color:#888;margin-bottom:4px">7-Day Moving Average Weight</div>
      <svg viewBox="0 0 ${W} ${H+16}" style="width:100%;overflow:visible">
        <path d="${path}" fill="none" stroke="#26A69A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#26A69A"/>
          <text x="${p[0].toFixed(1)}" y="${(p[1]-6).toFixed(1)}" text-anchor="middle" font-size="8" fill="#555" font-family="Georgia,serif">${vals[i]}</text>
          <text x="${p[0].toFixed(1)}" y="${H+12}" text-anchor="middle" font-size="7" fill="#aaa" font-family="Georgia,serif">${ma[i].date.slice(5)}</text>`).join('')}
      </svg>
    </div>`;
  })() : '';

  return `<div class="card">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
      <div style="background:#F0FAF8;border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--teal)">${a.ratePerWeek>=0?'-':''}${Math.abs(a.ratePerWeek).toFixed(2)}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">kg / week</div>
      </div>
      <div style="background:#EDE7F6;border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:700;color:#6A1B9A">${a.deficitPerDay>0?a.deficitPerDay:'—'}</div>
        <div style="font-size:10px;color:#888;margin-top:2px">kcal deficit/day</div>
      </div>
      <div style="background:#E3F2FD;border-radius:10px;padding:10px;text-align:center">
        <div style="font-size:18px;font-weight:700;color:#1565C0">${a.maintenance||'—'}</div>

function macroChart(hist, key, label, color, target) {
  const days = hist.slice(0, 14).reverse();
  if(days.length < 1) return '';
  const vals = days.map(d => Math.round(d[key]||0));
  const mx = Math.max(...vals, target) * 1.15;
  const W = 400, H = 90;
  const xs = W / Math.max(vals.length - 1, 1);
  const pts = vals.map((v,i) => [i*xs, H - (v/mx)*H]);
  const path = pts.map((p,i) => `${i===0?'M':'L'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const tY = (H - (target/mx)*H).toFixed(1);
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  const hit = vals.filter(v => key==='carbs' ? v<=target*1.1 : v>=target*0.9).length;
  return `<div style="margin-bottom:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span style="font-size:12px;font-weight:700;color:${color}">${label}</span>
      <span style="font-size:11px;color:#888">avg ${avg} · target ${target} · ${hit}/${vals.length} days ✓</span>
    </div>
    <svg viewBox="0 0 ${W} ${H+22}" style="width:100%;overflow:visible">
      <line x1="0" y1="${tY}" x2="${W}" y2="${tY}" stroke="${color}" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p,i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${color}"/>
        <text x="${p[0].toFixed(1)}" y="${(p[1]-7).toFixed(1)}" text-anchor="middle" font-size="12" fill="#666" font-family="Georgia,serif">${vals[i]}</text>
        <text x="${p[0].toFixed(1)}" y="${H+18}" text-anchor="middle" font-size="11" fill="#AAA" font-family="Georgia,serif">${days[i].date?.slice(5)||''}</text>`).join('')}
    </svg>
  </div>`;
}

let _foodCamStream = null;

async function openFoodCamera() {
  // Create overlay with live camera + capture button
  const ov = document.createElement('div');
  ov.id = 'food-cam-overlay';
  ov.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center';
  ov.innerHTML = `
    <div style="position:relative;width:100%;max-width:480px;flex:1;display:flex;align-items:center">

    </div>

    <div style="color:#fff;font-size:13px;margin:12px 0 4px;text-align:center;opacity:.8">Frame your meal and tap capture</div>

      <button onclick="closeFoodCamera()" style="padding:12px 24px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:24px;font-size:14px;font-weight:700">✕ Cancel</button>
      <button onclick="captureAndAnalyse()" style="width:70px;height:70px;border-radius:50%;background:#6A1B9A;color:#fff;border:4px solid #fff;font-size:28px;box-shadow:0 4px 20px rgba(0,0,0,.5)">📸</button>
      <button onclick="analysefromGallery()" style="padding:12px 24px;background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:24px;font-size:14px;font-weight:700">🖼 Gallery</button>
    </div>
  `;
  document.body.appendChild(ov);

  try {
    _foodCamStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 960 } }
    });
    const video = document.getElementById('food-video');
    video.srcObject = _foodCamStream;
    await video.play();
  } catch(e) {
    closeFoodCamera();
    // Fallback: open gallery picker directly
    analysefromGallery();
  }
}

function closeFoodCamera() {
  if(_foodCamStream) { _foodCamStream.getTracks().forEach(t => t.stop()); _foodCamStream = null; }
  const ov = document.getElementById('food-cam-overlay');
  if(ov) ov.remove();
}

function captureAndAnalyse() {
  const video = document.getElementById('food-video');
  const canvas = document.getElementById('food-canvas');
  if(!video || !canvas) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
  closeFoodCamera();
  runFoodAnalysis(base64);
}

function analysefromGallery() {
  closeFoodCamera();
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const base64 = ev.target.result.split(',')[1];
      runFoodAnalysis(base64);
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

async function pasteFoodAnalysisResult() {
  let text = '';
  try { text = await navigator.clipboard.readText(); } catch(e) {
    text = prompt('Paste Claude\'s JSON response here:') || '';
  }
  if(!text.trim()) return;
  document.getElementById('food-ai-ov')?.remove();
  try {
    const clean = text.replace(/```json|```/g,'').trim();
    const items = JSON.parse(clean);
    if(!Array.isArray(items) || items.length === 0) throw new Error('empty');
    showFoodAnalysisResults(items);
  } catch(e) {
    showFoodAnalysisError('Could not read results. Make sure you copied the full JSON from Claude.');
  }
}

function showFoodAnalysisError(msg) {
  const el = document.getElementById('barcode-result') || document.createElement('div');
  el.innerHTML = `<div style="padding:12px;background:#FFEBEE;border-radius:10px;margin-bottom:8px;font-size:13px;color:#C62828;font-weight:700">❌ ${msg}</div>`;
  if(!el.parentNode) { S.tab='log'; render(); setTimeout(()=>{ const br=document.getElementById('barcode-result'); if(br) br.appendChild(el); },100); }
}

function showFoodAnalysisResults(items) {
  // Switch to log tab and show results
  S.tab = 'log'; S.logTab = 'search'; render();
  setTimeout(() => {
    const el = document.getElementById('barcode-result');
    if(!el) return;

    const total = items.reduce((a,i)=>({

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#00695C;--lt-teal:#E0F2F1;--gold:#F57F17;--lt-gold:#FFF8E1;
  --dark:#1A1A2E;--red:#E53935;--green:#388E3C;--bg:#F4F7F6;
  --font:Georgia,"Times New Roman",serif;--mono:"Courier New",monospace;
  --shadow:0 2px 14px rgba(0,0,0,0.07);--radius:16px;
}
body{background:var(--bg);font-family:var(--font);max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden}
button{font-family:var(--font);cursor:pointer}
input{font-family:var(--font);outline:none}
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.inp{padding:9px 13px;border:1.5px solid #DDD;border-radius:10px;font-size:14px;width:100%;transition:border .2s;background:#fff}
.inp:focus{border-color:var(--teal)}
.sec{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:12px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F5F5F5}
.tabs{display:flex;gap:4px;padding:10px 12px;background:#fff;border-bottom:1px solid #EEE;overflow-x:auto;position:sticky;top:0;z-index:100}
.tab{padding:7px 13px;border-radius:20px;border:none;font-size:12px;white-space:nowrap;font-family:var(--font);transition:all .2s}
.tab.on{background:var(--teal);color:#fff;font-weight:700}
.tab:not(.on){background:transparent;color:#666}
.stab{padding:6px 13px;border-radius:14px;border:none;font-size:12px;font-family:var(--font);transition:all .2s}
.stab.on{background:var(--dark);color:#fff;font-weight:700}
.stab:not(.on){background:#F0F0F0;color:#666}
.hdr{background:linear-gradient(135deg,var(--dark) 0%,var(--teal) 100%);padding:22px 18px 18px;color:#fff}
.content{padding:14px 14px 90px}
.meal-hdr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1.5px solid #E8F0EE;background:#F8FFFE;margin-bottom:0}
.meal-hdr.open{border-color:var(--teal);background:var(--lt-teal);border-radius:10px 10px 0 0}
.meal-detail{padding:12px 14px;background:#FAFFFE;border:1.5px solid var(--teal);border-top:none;border-radius:0 0 10px 10px;margin-bottom:6px}
.excard{padding:12px 14px;border-radius:12px;margin-bottom:8px;border:1px solid #EEE;background:#fff;cursor:pointer;user-select:none;transition:all .2s}
.excard.done{background:#E8F5E9;border-color:#A5D6A7}
.excard.locked{opacity:.6;cursor:default;background:#F9F9F9}
.ring{display:flex;flex-direction:column;align-items:center;gap:3px}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid #DDD;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:8px;transition:all .2s}
.chk.on{border-color:var(--green);background:var(--green)}
.fade{animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
::-webkit-scrollbar{width:0;height:0}
</style>
</head>

const TRIP_START = "2025-03-29";
const TRIP_END   = "2025-04-02";

/** Returns active programme days (excluding trip break) */
const getActiveDays = (startDateStr) => {
  if (!startDateStr) return 0;
  const start = new Date(startDateStr); start.setHours(0, 0, 0, 0);
  const now   = new Date();             now.setHours(0, 0, 0, 0);
  if (now < start) return 0;
  const rawDiff = Math.floor((now - start) / 86400000);
  const tripS = new Date(TRIP_START); tripS.setHours(0, 0, 0, 0);
  const tripE = new Date(TRIP_END);   tripE.setHours(0, 0, 0, 0);
  let tripDays = 0;
  if (now > tripS) {
    const overlapEnd = now < tripE ? now : tripE;
    tripDays = Math.max(0, Math.floor((overlapEnd - tripS) / 86400000));
  }
  return Math.max(0, rawDiff - tripDays);
};

const getPhase = (startDateStr) => {
  const week = Math.floor(getActiveDays(startDateStr) / 7) + 1;
  if (week <= 4) return 1;
  if (week <= 8) return 2;
  return 3;
};

const getPhaseWeek = (startDateStr) =>
  Math.min(Math.floor(getActiveDays(startDateStr) / 7) + 1, 12);

const isTripDay = () => {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const ts  = new Date(TRIP_START); ts.setHours(0, 0, 0, 0);
  const te  = new Date(TRIP_END);   te.setHours(0, 0, 0, 0);
  return now >= ts && now <= te;
};

const FB_KEY = 'fb_config';
let fbApp=null, fbDb=null, fbUser=null, fbSyncing=false;

function fbConfig() { return LS.get(FB_KEY, null); }

async function fbInit(cfg) {
  if(!cfg) return;
  try {
    const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getDatabase, ref, set, get, onValue } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const { getAuth, signInAnonymously, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');

    const existing = getApps();
    fbApp = existing.length ? existing[0] : initializeApp(cfg);
    fbDb = getDatabase(fbApp);
    const auth = getAuth(fbApp);

    await signInAnonymously(auth);
    onAuthStateChanged(auth, async user => {
      if(user) {
        fbUser = user.uid;
        LS.set('fb_uid', fbUser);
        await fbPull();
        fbWatch();
      }
    });
  } catch(e) { console.warn('Firebase init failed:', e.message); }
}

async function fbPush() {
  if(!fbDb||!fbUser||fbSyncing) return;
  try {
    const { ref, set } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const data = {
      prog_start: S.startDate||'',
      diet_mode: S.diet||'keto',
      history: LS.get('hlog_history',[]),
      today: S.day,
      today_date: S.date,
      done_ex: S.doneEx,
      updated: Date.now()
    };
    // Also save last 90 days of daily logs
    const logs = {};
    const hist = LS.get('hlog_history',[]);
    hist.forEach(h => { const d = LS.get('hlog_'+h.date,null); if(d) logs[h.date.replace(/-/g,'_')]=d; });
    data.logs = logs;
    await set(ref(fbDb, 'users/'+fbUser), data);
    showSyncBadge('✓');
  } catch(e) { showSyncBadge('⚠'); }
}

async function fbPull() {
  if(!fbDb||!fbUser) return;
  try {
    fbSyncing = true;
    const { ref, get } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
    const snap = await get(ref(fbDb, 'users/'+fbUser));
    if(snap.exists()) {
      const data = snap.val();
      // Only restore if cloud is newer or local has no start date
      if(data.prog_start && !S.startDate) {
        S.startDate = data.prog_start;
        LS.set('prog_start', data.prog_start);
      }
      if(data.diet_mode) { S.diet=data.diet_mode; LS.set('diet_mode',data.diet_mode); }
      if(data.history) { LS.set('hlog_history', data.history); S.hist=data.history; }
      // Restore daily logs
      if(data.logs) {
        Object.entries(data.logs).forEach(([k,v]) => {
          const date = k.replace(/_/g,'-');
          LS.set('hlog_'+date, v);
        });
      }
      // Restore today if same date
      if(data.today && data.today_date === S.date) {
        S.day = {...blankDay(), ...data.today};
        saveDay(S.date, S.day);
      }
      if(data.done_ex && data.today_date === S.date) {
        S.doneEx = data.done_ex;
        LS.set('done_ex_'+S.date, S.doneEx);
      }
      render();
    }
  } catch(e) { console.warn('fbPull failed:', e); }
  finally { fbSyncing = false; }
}

function circuitExList() {
  const ts = todaySched(), phwk = pw();
  const all = [
    ...(ts.strength ? STRENGTH_EXERCISES : []),
    ...(ts.core ? [...CORE_EXERCISES_EARLY, ...CORE_EXERCISES_LATE] : [])

  const ex = circuitExList()[0];

    S.circuit.timerSecs = TIMED_EX[ex.name];
    startCircuitTimer();
  }
  render();
}

function startCircuitTimer() {
  stopCircuitTimer();
  S.circuit.timerId = setInterval(() => {
    if(S.circuit.phase === 'rest') {
      S.circuit.restSecs--;
      if(S.circuit.restSecs <= 0) {
        // Rest over — start next round
        S.circuit.phase = 'exercise';
        S.circuit.exIdx = 0;
        const ex = circuitExList()[S.circuit.exIdx];
        if(ex && TIMED_EX[ex.name]) {
          S.circuit.timerSecs = TIMED_EX[ex.name];
        } else {
          S.circuit.timerSecs = 0;
        }
        stopCircuitTimer();
        render();
        return;
      }
    } else if(S.circuit.timerSecs > 0) {
      S.circuit.timerSecs--;
      if(S.circuit.timerSecs <= 0) {
        // Timed exercise done — advance
        circuitNext();
        return;
      }
    }
    // Update timer display only (lightweight)
    const el = document.getElementById('circuit-timer');
    if(el) {
      if(S.circuit.phase === 'rest') {
        el.textContent = fmtSecs(S.circuit.restSecs);
      } else if(S.circuit.timerSecs > 0) {
        el.textContent = fmtSecs(S.circuit.timerSecs);
      }
    }
  }, 1000);
}

function stopCircuitTimer() {
  if(S.circuit.timerId) { clearInterval(S.circuit.timerId); S.circuit.timerId = null; }
}

function fmtSecs(s) {
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function circuitNext() {
  stopCircuitTimer();
  const exList = circuitExList();
  // Mark current exercise as done
  const curEx = exList[S.circuit.exIdx];
  if(curEx && !S.doneEx.includes(curEx.name)) {
    S.doneEx.push(curEx.name);
    LS.set('done_ex_' + S.date, S.doneEx);
  }
  const nextIdx = S.circuit.exIdx + 1;
  if(nextIdx >= exList.length) {
    // Round complete
    if(S.circuit.round >= CIRCUIT_TOTAL_ROUNDS) {
      // All done!
      S.circuit.active = false;
      persist(); render(); return;
    }
    // Start rest between rounds
    S.circuit.phase = 'rest';
    S.circuit.restSecs = REST_BETWEEN_ROUNDS;
    S.circuit.round++;
    // Clear done list for new round tracking (but keep logged)
    startCircuitTimer();
    render(); return;
  }
  // Next exercise in round
  S.circuit.exIdx = nextIdx;
  S.circuit.phase = 'exercise';
  const nextEx = exList[nextIdx];
  if(nextEx && TIMED_EX[nextEx.name]) {
    S.circuit.timerSecs = TIMED_EX[nextEx.name];
    startCircuitTimer();
  } else {
    S.circuit.timerSecs = 0;
  }
  render();
}

function circuitSkip() {
  circuitNext();
}

// ─── FASTING ────────────────────────────────────────────────────────
// S.day.fasting    = bool, is timer running right now
// S.day.fastStart  = Date.now() of current session start
// S.day.fastBest   = best continuous seconds achieved today (saved on stop)
// S.fastElapsed    = live seconds of current session (display only)

function startTimer() {
  if(S.fastTimer) clearInterval(S.fastTimer);
  if(S.day.fasting && S.day.fastStart) {
    S.fastTimer = setInterval(()=>{
      S.fastElapsed = Math.floor((Date.now()-S.day.fastStart)/1000);
      tickTimer();
    },1000);
  }
}
function tickTimer() {
  const el=document.getElementById('ft'); const arc=document.getElementById('fa');
  if(!el||!arc) return;
  const R=85, C=2*Math.PI*R, pct=Math.min(S.fastElapsed/3600/19,1);
  el.textContent=hms(S.fastElapsed);
  arc.setAttribute('stroke-dashoffset',C*(1-pct));
  arc.setAttribute('stroke',pct>=1?'#66BB6A':'var(--teal)');
}
function toggleFast() {
  if(S.day.fasting) {
    // Stop — save this session as best if it's the longest
    const sessionSecs = Math.floor((Date.now()-S.day.fastStart)/1000);
    S.day.fastBest = Math.max(S.day.fastBest||0, sessionSecs);
    S.day.fasting = false;
    S.day.fastStart = null;
    S.fastElapsed = 0;
    if(S.fastTimer){ clearInterval(S.fastTimer); S.fastTimer=null; }
  } else {
    // Start fresh session — reset elapsed, keep best
    S.day.fasting = true;
    S.day.fastStart = Date.now();
    S.fastElapsed = 0;
    startTimer();
  }
  persist(); render();
}
function resetFast() {
  if(!confirm('Reset all fasting data for today?')) return;
  S.day.fasting=false; S.day.fastStart=null; S.day.fastBest=0; S.fastElapsed=0;
  if(S.fastTimer){ clearInterval(S.fastTimer); S.fastTimer=null; }
  persist(); render();
}

// ─── PERSISTENCE ────────────────────────────────────────────────────
function persist() {
  saveDay(S.date, S.day);
  const t=tots();
  const entry={date:S.date,...t,weight:S.day.weight,water:S.day.water,workoutDone:(S.day.workouts||[]).length>0};
  const h=LS.get('hlog_history',[]);
  const i=h.findIndex(x=>x.date===S.date);
  if(i>=0) h[i]=entry; else h.unshift(entry);
  const trimmed=h.slice(0,90);
  LS.set('hlog_history',trimmed);
  S.hist=trimmed;
  // Firebase sync (debounced)
  if(fbDb && fbUser) {
    clearTimeout(S._fbTimer);
    S._fbTimer = setTimeout(fbPush, 2000);
  }
}

function addFood(food,qty) {
  const sc=scale(food,qty); sc.cal=sc.cal||kcal(sc);
  S.day.entries.push({id:Date.now(),name:food.name,qty,...sc});
  S.sel=null; S.srch=''; S.qty=1; persist(); render();
}
function rmFood(id) { S.day.entries=S.day.entries.filter(e=>e.id!==id); persist(); render(); }
function addWater(v) { S.day.water=Math.max(0,+(S.day.water+v).toFixed(2)); persist(); render(); }
function saveWt() { if(!S.wtInp)return; S.day.weight=+S.wtInp; S.wtInp=''; persist(); render(); }
function logWalk() {
  if(!S.wdur)return;
  (S.day.workouts=S.day.workouts||[]).push({id:Date.now(),duration:+S.wdur,distance:S.wdist?+S.wdist:null,note:S.wnote,time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})});
  S.wdur='';S.wdist='';S.wnote=''; persist(); render();
}
function rmWalk(id) { S.day.workouts=(S.day.workouts||[]).filter(w=>w.id!==id); persist(); render(); }
function togEx(name) {
  if(S.doneEx.includes(name)) S.doneEx=S.doneEx.filter(x=>x!==name); else S.doneEx.push(name);
  LS.set('done_ex_'+S.date,S.doneEx); render();
}
function addCust() {
  if(!S.cust.name)return;
  const f={name:S.cust.name,protein:+S.cust.protein||0,carbs:+S.cust.carbs||0,fat:+S.cust.fat||0,cal:+S.cust.cal||0,custom:true};
  if(!f.cal) f.cal=kcal(f);
  // Save to persistent custom foods list
  const customs = LS.get('custom_foods',[]);
  if(!customs.find(x=>x.name===f.name)) {
    customs.push(f);
    LS.set('custom_foods', customs);
    FOOD_DB.push(f);
  }
  addFood(f,1); S.cust={name:'',protein:'',carbs:'',fat:'',cal:''}; S.showCust=false;
}
function deleteCustomFood(idx) {
  const customs = LS.get('custom_foods',[]);
  const name = customs[idx]?.name;
  if(!confirm(`Remove "${name}" from custom foods?`)) return;
  customs.splice(idx,1);
  LS.set('custom_foods', customs);
  // Remove from live FOOD_DB too
  const dbIdx = FOOD_DB.findIndex(f=>f.name===name&&f.custom);
  if(dbIdx>=0) FOOD_DB.splice(dbIdx,1);
  render();
}

// ─── WHATSAPP ───────────────────────────────────────────────────────
function genWA(p) {
  let t=`\u{1F373} *\u0915\u0932 \u0915\u093E \u0916\u093E\u0928\u093E \u2014 ${p.day}*\n_${p.theme}_\n\n`;
  t+=`\u23F0 *\u0916\u093E\u0928\u0947 \u0915\u093E \u0938\u092E\u092F:* \u0926\u094B\u092A\u0939\u0930 2 \u092C\u091C\u0947 \u0938\u0947 \u0936\u093E\u092E 7 \u092C\u091C\u0947 \u0924\u0915 _(2 PM - 7 PM only)_\n\n`;
  t+=`\u{1F6D2} *\u0938\u092C\u094D\u091C\u093C\u0940 / \u0915\u093F\u0930\u093E\u0928\u093E \u0932\u093F\u0938\u094D\u091F:*\n`;
  p.grocery.forEach(g=>{ t+=`* ${g.hi} - *${g.qty}* (${g.en})\n`; });
  if(p.shake) t+=`* Isopure Whey - \u0938\u093E\u0939\u092C \u0916\u0941\u0926 \u092C\u0928\u093E\u090F\u0902\u0917\u0947\n`;
  t+='\n';
  (p.meals||[]).forEach((m,mi)=>{
    t+=`\u{1F37D} *\u0916\u093E\u0928\u093E ${mi+1} - ${m.time}*\n*${m.name}*\n`;
    if(m.ingredients?.length){ t+=`_\u0938\u093E\u092E\u0917\u094D\u0930\u0940:_\n`; m.ingredients.forEach(i=>{ t+=`  * ${i.hi} (${i.en}) - ${i.qty}\n`; }); }
    if(m.steps?.length){ t+=`_\u0924\u0930\u0940\u0915\u093E:_\n`; m.steps.forEach((s,si)=>{ t+=`  ${si+1}. ${s.hi} (${s.en})\n`; }); }
    t+='\n';
  });
  t+=`\u26A0 *\u091C\u093C\u0930\u0942\u0930\u0940:*\n\u274C \u0924\u0947\u0932 \u0928\u0939\u0940\u0902 - \u0938\u093F\u0930\u094D\u092B \u0918\u0940/\u092E\u0915\u094D\u0916\u0928\n`;
  if(S.diet==='keto') t+=`\u274C \u091A\u093E\u0935\u0932, \u0930\u094B\u091F\u0940, \u0926\u093E\u0932 \u0928\u0939\u0940\u0902\n`;
  t+=`\u274C \u091A\u0940\u0928\u0940 \u0928\u0939\u0940\u0902\n\n*Nutrition:* Protein ~${p.totals.protein}g, Carbs ~${p.totals.carbs}g, Cal ~${p.totals.cal} kcal`;
  return t;
}

}

    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E0E0E0" stroke-width="8"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${ov?'#EF5350':color}" stroke-width="8"
        stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"

      <text x="${size/2}" y="${size/2-3}" text-anchor="middle" fill="${ov?'#EF5350':'var(--dark)'}" font-size="13" font-weight="700" font-family="Georgia,serif">${Math.round(val)}</text>

function logMealFromPlan(mealKey) {
  const tp = todayPlan();
  const meal = mealKey === 'm0' ? tp.meals?.[0] : tp.meals?.[1];
  if(!meal) return;
  // Find matching food in FOOD_DB by meal name
  const f = FOOD_DB.find(x => x.name === meal.name);
  if(f) {
    addFood(f, 1);
  } else {
    // Add as custom entry using meal macros directly
    const entry = { name: meal.name, protein: meal.protein, carbs: meal.carbs, fat: meal.fat||0, cal: meal.cal, qty: 1, ts: Date.now() };
    S.day.entries.push(entry);
    persist(); render();
  }
  alert('✓ ' + meal.name + ' logged!');

  const locked=ex.phase===2&&phwk<5;
  const nameEsc=ex.name.replace(/'/g,"\\'");
  return `<div class="excard ${done?'done':''} ${locked?'locked':''}" ${locked?'':'onclick="togEx(\''+nameEsc+'\')"'}>

          ${locked?'<span style="font-size:10px;background:#EEE;color:#AAA;border-radius:8px;padding:2px 6px">Wk 5+</span>':''}

}

function tabToday() {
  const tp=todayPlan(), t=tots(), tg=tgt(), ts=todaySched();
  const wm=walkMins(), wTarget=wt(), phwk=pw();

  const validEx=allEx.filter(e=>!(e.phase===2&&phwk<5));
  const doneC=validEx.filter(e=>S.doneEx.includes(e.name)).length;

  const pMsg=t.protein>=tg.protein?'On target ✓':t.protein>=90?`${Math.round(tg.protein-t.protein)}g to go`:`${Math.round(tg.protein-t.protein)}g short — add eggs/whey`;
  const pCol=t.protein>=tg.protein?'var(--green)':t.protein>=90?'var(--gold)':'var(--red)';
  const cMsg=t.carbs<=tg.carbs?`${Math.round(tg.carbs-t.carbs)}g remaining ✓`:`${Math.round(t.carbs-tg.carbs)}g over`;
  const cCol=t.carbs<=tg.carbs?'var(--green)':'var(--red)';
  const wMsg=ts.rest?'Rest day':wm>=wTarget?`${wm}/${wTarget} min ✓`:wm>0?`${wm}/${wTarget} min`:`${wTarget} min target`;

          <div style="font-size:11px;letter-spacing:1px;text-transform:uppercase;color:${S.diet==='keto'?'var(--teal)':'var(--gold)'};margin-bottom:2px">${S.diet==='keto'?'Keto':'Low-Carb Dal'} · ${dow()}</div>

        </div>
        <button onclick="S.tab='tomorrow';render()" style="font-size:11px;padding:4px 10px;background:var(--lt-teal);color:var(--teal);border:none;border-radius:8px;font-weight:700">Tomorrow →</button>
      </div>
      ${MealRow(tp.meals?.[0],'2:00 PM','Meal 1','m0')}

    <div class="card" style="background:#E8F5E9;border:1px solid #A5D6A7">

          📲 Open WhatsApp

function foodListHTML(foods) {
  return foods.map(f=>{
    const esc=f.name.replace(/'/g,"\\'");
    const sel=S.sel?.name===f.name;
    return `<div onclick="pickFood('${esc}')" style="padding:10px 12px;border-radius:10px;margin-bottom:4px;cursor:pointer;background:${sel?'var(--lt-teal)':'#FAFAFA'};border:1.5px solid ${sel?'var(--teal)':'transparent'}">
      <div style="font-size:13px;font-weight:600;color:var(--dark)">${f.name}</div>
      <div style="font-size:11px;color:#888">P:${f.protein}g · C:${f.carbs}g · ${f.cal} kcal</div>
    </div>`;
  }).join('');
}
function pickFood(name) {
  const f=FOOD_DB.find(x=>x.name===name);
  if(!f)return;
  S.sel=S.sel?.name===name?null:f; S.qty=1;
  repaintList();
}
function repaintList() {
  const fl=document.getElementById('flist');
  const fp=document.getElementById('fpanel');
  if(fl) fl.innerHTML=foodListHTML(srch(S.srch));
  if(fp) fp.innerHTML=S.sel?`<div style="margin-top:12px;padding:14px;background:var(--lt-teal);border-radius:12px">
    <div style="font-size:13px;font-weight:700;color:var(--teal);margin-bottom:10px">${S.sel.name}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:12px;color:#555">Servings:</span>
      <button onclick="S.qty=Math.max(0.5,+(S.qty-.5).toFixed(1));updSel()" style="width:28px;height:28px;border-radius:50%;border:1.5px solid var(--teal);background:#fff;color:var(--teal);font-size:16px">−</button>
      <span id="qty-n" style="font-size:16px;font-weight:700;color:var(--dark);min-width:28px;text-align:center">${S.qty}</span>
      <button onclick="S.qty=+(S.qty+.5).toFixed(1);updSel()" style="width:28px;height:28px;border-radius:50%;border:1.5px solid var(--teal);background:var(--teal);color:#fff;font-size:16px">+</button>
    </div>
    <div id="sel-prev" style="font-size:12px;color:#666;margin-bottom:10px">→ P:${+(S.sel.protein*S.qty).toFixed(1)}g · C:${+(S.sel.carbs*S.qty).toFixed(1)}g · ${Math.round(S.sel.cal*S.qty)} kcal</div>
    <button onclick="addFood(S.sel,S.qty)" style="width:100%;padding:10px;background:var(--teal);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700">Add to Log</button>
  </div>`:'';
}
function updSel() {
  const qn=document.getElementById('qty-n');
  const sp=document.getElementById('sel-prev');
  if(qn) qn.textContent=S.qty;
  if(sp&&S.sel) sp.textContent=`→ P:${+(S.sel.protein*S.qty).toFixed(1)}g · C:${+(S.sel.carbs*S.qty).toFixed(1)}g · ${Math.round(S.sel.cal*S.qty)} kcal`;
}

// ─── TAB: FASTING ────────────────────────────────────────────────────
function tabFast() {
  const R=85, C=2*Math.PI*R;
  const best = S.day.fastBest || 0;
  const display = S.day.fasting ? S.fastElapsed : best;
  const pct = Math.min(display/3600/19, 1);
  const reached = display >= 19*3600;
  const bestReached = best >= 19*3600;

  return `
    <div class="card" style="text-align:center">
      <div class="sec">Fasting Timer</div>
      <svg width="200" height="200" style="display:block;margin:0 auto 16px">
        <circle cx="100" cy="100" r="${R}" fill="none" stroke="#E0F2F1" stroke-width="14"/>
        <circle id="fa" cx="100" cy="100" r="${R}" fill="none"
          stroke="${reached?'#66BB6A':'var(--teal)'}" stroke-width="14"
          stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"
          stroke-linecap="round" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset 1s linear"/>
        <text id="ft" x="100" y="88" text-anchor="middle" fill="var(--dark)" font-size="26" font-weight="700" font-family="Georgia,serif">${hms(display)}</text>
        <text x="100" y="108" text-anchor="middle" fill="#888" font-size="11" font-family="Georgia,serif">${S.day.fasting?'current session':best>0?'best session today':'of 19h target'}</text>
        <text x="100" y="124" text-anchor="middle" fill="${S.day.fasting?'var(--teal)':'#BBB'}" font-size="10" font-family="Georgia,serif">${S.day.fasting?'fasting — tap to stop':best>0?'tap to start new session':'tap to start'}</text>
      </svg>

      <div style="display:flex;gap:10px;justify-content:center">
        <button onclick="toggleFast()" style="padding:13px 34px;background:${S.day.fasting?'var(--red)':'var(--teal)'};color:#fff;border:none;border-radius:30px;font-size:15px;font-weight:700">
          ${S.day.fasting?'⏹ Stop Fast':best>0?'▶ New Session':'▶ Start Fast'}
        </button>
        ${best>0||S.day.fasting?`<button onclick="resetFast()" style="padding:13px 14px;background:#F5F5F5;color:#AAA;border:none;border-radius:30px;font-size:13px">↺</button>`:''}
      </div>

      ${reached?'<div style="margin-top:14px;font-size:14px;color:var(--green);font-weight:700">🎉 19-hour target reached!</div>':''}

      ${best>0?`
      <div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <div style="padding:8px 16px;background:${bestReached?'#E8F5E9':'var(--lt-teal)'};border-radius:10px;border:1px solid ${bestReached?'#A5D6A7':'#B2DFDB'}">
          <div style="font-size:10px;color:#888;margin-bottom:2px">Best today</div>
          <div style="font-size:15px;font-weight:700;color:${bestReached?'var(--green)':'var(--teal)'}">${hms(best)} ${bestReached?'✓':''}</div>
        </div>
        ${S.day.fasting?`
        <div style="padding:8px 16px;background:#FFF8E1;border-radius:10px;border:1px solid #FFE082">
          <div style="font-size:10px;color:#888;margin-bottom:2px">This session</div>
          <div style="font-size:15px;font-weight:700;color:var(--gold)">${hms(S.fastElapsed)}</div>
        </div>`:''}
      </div>`:''}

      <div style="margin-top:12px;padding:10px;background:#F8F8F8;border-radius:10px;font-size:11px;color:#888;line-height:1.6">
        Fat burn ~12h · Autophagy ~16h · Peak ~19h<br/>
        <span style="color:var(--red);font-weight:600">Breaking the fast resets the clock</span> — only continuous time counts
      </div>
    </div>

    <div class="card">
      <div class="sec">Medications</div>
      ${[['Ozempic','Once weekly','Same day each week'],['Saroglitazar','With Meal 1 (~2 PM)','Always with food'],['Olmesartan 20mg','With Meal 1 (~2 PM)','Rise slowly after exercise — dizziness risk']].map(([n,w,note])=>`
        <div style="padding:10px 0;border-bottom:1px solid #F5F5F5">
          <div style="display:flex;justify-content:space-between">
            <span style="font-size:13px;font-weight:700;color:var(--dark)">${n}</span>
            <span style="font-size:12px;color:var(--teal);font-weight:600">${w}</span>
          </div>
          <div style="font-size:11px;color:#888;margin-top:2px">${note}</div>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="sec">Supplements</div>
      ${[['Multivitamin (low K⁺)','With Meal 1'],['Vitamin B12 500mcg','With Meal 1'],['Vitamin D3 2,000 IU','With Meal 1'],['Magnesium Glycinate 300mg','Bedtime']].map(([sup,tim])=>`
        <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F5F5F5">
          <span style="font-size:13px;color:var(--dark)">${sup}</span>
          <span style="font-size:12px;color:#888">${tim}</span>
        </div>`).join('')}
    </div>`;
}

// ─── TAB: WORKOUT ────────────────────────────────────────────────────
function tabWorkout() {
  const ts=todaySched(), phnum=ph(), phwk=pw(), wTarget=wt(), wm=walkMins();
  const allEx=[...(ts.strength?STRENGTH_EXERCISES:[]),...(ts.core?[...CORE_EXERCISES_EARLY,...CORE_EXERCISES_LATE]:[])];
  const validEx=allEx.filter(e=>!(e.phase===2&&phwk<5));
  const doneC=validEx.filter(e=>S.doneEx.includes(e.name)).length;

  const stabs=['today','walk','strength','core','schedule'].map(t=>`<button class="stab ${S.wtab===t?'on':''}" onclick="S.wtab='${t}';if(S.circuit.active){stopCircuit();}render()">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join('');

  let body='';
  if(S.wtab==='today') {
    if(isTripDay()) body=`<div class="card" style="text-align:center;padding:30px;background:#FFFDE7;border:1px solid var(--gold)"><div style="font-size:40px;margin-bottom:10px">🏖️</div><div style="font-size:15px;font-weight:700;color:var(--gold);margin-bottom:6px">Trip Break — Mar 29 to Apr 2</div><div style="font-size:12px;color:#888;line-height:1.6">No targets today. Enjoy!<br/>Programme resumes April 3rd.</div></div>`;
    else if(ts.rest) body=`<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px;margin-bottom:10px">🛌</div><div style="font-size:15px;font-weight:700;color:#555;margin-bottom:6px">Rest day — no exercise</div><div style="font-size:12px;color:#888">Recovery is when muscle is built.</div></div>`;
    else {
      const wLog=ts.walk?`<div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:13px;font-weight:700;color:var(--teal)">🚶 Walk</span>
          <span style="font-size:13px;font-weight:700;color:${wm>=wTarget?'var(--green)':'var(--gold)'}">${wm}/${wTarget} min ${wm>=wTarget?'✓':''}</span>
        </div>
        <div style="height:8px;background:#EEE;border-radius:4px;overflow:hidden;margin-bottom:14px">
          <div style="height:100%;width:${Math.min(wm/wTarget*100,100)}%;background:${wm>=wTarget?'#66BB6A':'var(--teal)'};border-radius:4px;transition:width .5s"></div>
        </div>
        <div style="display:flex;gap:8px">
          <input class="inp" type="number" value="${S.wdur}" placeholder="Duration (min)" oninput="S.wdur=this.value" style="flex:1"/>
          <input class="inp" type="number" value="${S.wdist}" placeholder="km" oninput="S.wdist=this.value" style="width:70px"/>
        </div>
        <input class="inp" value="${S.wnote}" placeholder="Note (optional)" oninput="S.wnote=this.value" style="margin-top:8px;margin-bottom:10px"/>
        <button onclick="logWalk()" ${!S.wdur?'disabled':''} style="width:100%;padding:10px;background:${S.wdur?'var(--teal)':'#CCC'};color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700">Log Walk</button>
        ${(S.day.workouts||[]).map(w=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:6px 0;border-top:1px solid #F5F5F5"><span style="font-size:12px;color:#555">🚶 ${w.duration}min${w.distance?' · '+w.distance+'km':''} · ${w.time}</span><button onclick="rmWalk(${w.id})" style="background:none;border:none;color:#CCC;font-size:18px">×</button></div>`).join('')}
      </div>`:'';
      const exBlock=(ts.strength||ts.core)?`${S.circuit.active ? renderCircuit() : `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <span style="font-size:13px;font-weight:700;color:var(--teal)">💪 Exercises today</span>
            <span style="font-size:13px;font-weight:700;color:${doneC===validEx.length&&validEx.length>0?'var(--green)':'var(--gold)'}">${doneC}/${validEx.length} done</span>
          </div>
          <button onclick="startCircuit()" style="width:100%;padding:13px;background:linear-gradient(135deg,var(--dark),var(--teal));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;margin-bottom:8px">
            ⚡ Start Circuit (${CIRCUIT_TOTAL_ROUNDS} rounds)
          </button>
          <button onclick="logAllExercises()" style="width:100%;padding:11px;background:${doneC===validEx.length&&validEx.length>0?'#E8F5E9':'#F5F5F5'};color:${doneC===validEx.length&&validEx.length>0?'var(--green)':'#666'};border:none;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:14px">
            ${doneC===validEx.length&&validEx.length>0?'✓ All Exercises Logged':'✅ Log All Exercises Done'}
          </button>
          <div style="font-size:11px;color:#888;margin-bottom:12px;text-align:center">or tap individual exercises below</div>
          ${ts.strength?STRENGTH_EXERCISES.map(ex=>ExCard(ex,S.doneEx.includes(ex.name),phwk)).join(''):''}
          ${ts.core?`<div style="font-size:12px;font-weight:700;color:#888;margin-top:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">Core</div>${[...CORE_EXERCISES_EARLY,...CORE_EXERCISES_LATE].map(ex=>ExCard(ex,S.doneEx.includes(ex.name),phwk)).join('')}`:''}
        </div>`}`:'';
      body=`<div class="card" style="border-left:4px solid var(--teal)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div>
            <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:2px">${ts.day}</div>
            <div style="font-size:17px;font-weight:700;color:var(--dark)">${[ts.walk&&'Walk',ts.strength&&'Strength',ts.core&&'Core'].filter(Boolean).join(' + ')}</div>

      </div>${wLog}${exBlock}`;
    }
  } else if(S.wtab==='walk') {

      ${Object.entries(PHASE_LABELS).map(([p,info])=>`<div style="padding:12px 14px;border-radius:12px;margin-bottom:8px;background:${+p===phnum?'var(--lt-teal)':'#FAFAFA'};border:1px solid ${+p===phnum?'var(--teal)':'#EEE'}">
        <div style="display:flex;justify-content:space-between"><span style="font-size:13px;font-weight:700;color:${+p===phnum?'var(--teal)':'var(--dark)'}">${info.label}</span>${+p===phnum?'<span style="font-size:11px;background:var(--teal);color:#fff;border-radius:8px;padding:2px 8px">Current</span>':''}</div>

      </div>
    </div>`;
  } else if(S.wtab==='core') {
    body=`<div class="card"><div class="sec">Core Exercises</div>
      <div style="font-size:12px;color:#888;margin-bottom:14px">3 days/week · ~8–10 min · Tap to mark done</div>
      <div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:8px">Weeks 1–4 (Foundation)</div>
      ${CORE_EXERCISES_EARLY.map(ex=>ExCard(ex,S.doneEx.includes(ex.name),phwk)).join('')}
      <div style="font-size:12px;font-weight:700;color:${phwk>=5?'var(--teal)':'#AAA'};margin-top:16px;margin-bottom:8px">Weeks 5–12 ${phwk<5?'(Unlocks week 5)':'(Now active)'}</div>
      ${CORE_EXERCISES_LATE.map(ex=>ExCard(ex,S.doneEx.includes(ex.name),phwk)).join('')}

      </div>
    </div>`;
  } else {
    body=`<div class="card"><div class="sec">Weekly Schedule</div>

        const isT=s.day===dow();
        const acts=s.rest?['Rest']:[s.walk&&'Walk 🚶',s.strength&&'Strength 💪',s.core&&'Core 🧱'].filter(Boolean);

          ${isT?'<span style="font-size:11px;background:var(--teal);color:#fff;border-radius:8px;padding:2px 8px;flex-shrink:0">Today</span>':''}
        </div>`;
      }).join('')}
    </div>`;
  }

  return `
  ${!S.startDate ? `
  <div class="card" style="background:var(--lt-teal);border:1.5px solid var(--teal)">
    <div style="font-size:14px;font-weight:700;color:var(--teal);margin-bottom:8px">Set Programme Start Date</div>

      <button onclick="setStartDate(document.getElementById('wd-inp').value)"
        style="padding:8px 14px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-weight:700">Set</button>
    </div>
  </div>` : `
  <div style="padding:12px 16px;border-radius:var(--radius);background:var(--lt-teal);border:1.5px solid var(--teal);margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--teal)">${PHASE_LABELS[phnum].label}</div>
        <div style="font-size:11px;color:#555">${PHASE_LABELS[phnum].weeks} · ${PHASE_LABELS[phnum].walk}</div>
        <div style="font-size:11px;color:#888;margin-top:2px">Started: ${S.startDate} · Trip break: Mar 29–Apr 2</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:20px;font-weight:700;color:var(--teal)">Wk ${Math.min(phwk,12)}</div>
        <button onclick="clearStartDate()" style="font-size:10px;color:#AAA;background:none;border:none;cursor:pointer;margin-top:2px">reset</button>
      </div>
    </div>
  </div>`}
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">${stabs}</div>
  ${body}`;
}

// ─── TAB: HISTORY ────────────────────────────────────────────────────
let aiReviewText = '';
let aiReviewLoading = false;

async function runAIReview() {
  if(aiReviewLoading) return;
  aiReviewLoading = true;
  aiReviewText = '';
  render();

  const h = S.hist.slice(0, 7);
  const tg = tgt();
  const profile = `Patient: 48-year-old male, 168cm, ~116kg. Medications: Ozempic, Saroglitazar (NAFLD), Olmesartan 20mg. Diet: ${S.diet==='keto'?'Keto (targets: 110g protein, 22g carbs, 95g fat, 1350 kcal)':'Low-carb dal (targets: 100g protein, 45g carbs, 70g fat, 1200 kcal)'}. Fasting: 19:5 intermittent fasting (eating 2-7 PM). Exercise: fasted morning walk + circuit training 3x/week.`;
  const logs = h.map(x => {
    const day = LS.get('hlog_'+x.date, null);
    return `${x.date}: P=${Math.round(x.protein)}g C=${Math.round(x.carbs)}g F=${Math.round(x.fat||0)}g Cal=${Math.round(x.cal)} Water=${x.water||0}L Weight=${x.weight||'not logged'}kg Walk=${x.workoutDone?'yes':'no'} FastBest=${day?.fastBest?Math.round((day.fastBest||0)/3600*10)/10+'h':'unknown'}`;
  }).join('\n');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `You are a health coach reviewing a patient's weekly progress. Be warm, specific, and actionable. Format your response with clear sections using emojis. Keep it concise — under 400 words. Patient profile: ${profile}`,
        messages: [{ role: 'user', content: `Here are my last ${h.length} days of health data:\n\n${logs}\n\nPlease review my progress covering: 1) Nutrition consistency 2) Fasting adherence 3) Exercise completion 4) Weight trend 5) Top 2-3 specific suggestions for improvement this week.` }]
      })
    });
    const data = await res.json();
    aiReviewText = data.content?.[0]?.text || 'Could not get review. Please try again.';
  } catch(e) {
    aiReviewText = 'Connection error. Please check your internet and try again.';
  }
  aiReviewLoading = false;
  render();
}

function tabHistory() {
  const h=S.hist, wd=h.filter(x=>x.weight).slice(0,14).reverse();
  const tg=tgt();
  let chart='';
  if(wd.length>=2) {
    const vals=wd.map(d=>d.weight), mn=Math.min(...vals)-1, mx=Math.max(...vals)+1;
    const W=400,H=90, xs=W/Math.max(vals.length-1,1);
    const pts=vals.map((v,i)=>[i*xs, H-((v-mn)/(mx-mn))*H]);
    const path=pts.map((p,i)=>`${i===0?'M':'L'}${p[0]},${p[1]}`).join(' ');
    const lost=wd[0].weight-wd[wd.length-1].weight;
    chart=`<div class="card"><div class="sec">Weight Trend</div>
      <svg viewBox="0 0 ${W} ${H+20}" style="width:100%;overflow:visible">
        <path d="${path}" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map((p,i)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--teal)"/>
          <text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="9" fill="#666" font-family="Georgia,serif">${vals[i]}</text>
          <text x="${p[0]}" y="${H+16}" text-anchor="middle" font-size="8" fill="#AAA" font-family="Georgia,serif">${wd[i].date?.slice(5)}</text></g>`).join('')}
      </svg>
      ${lost>0?`<div style="margin-top:8px;font-size:12px;color:var(--green);text-align:center;font-weight:700">↓ ${lost.toFixed(1)}kg lost</div>`:''}
    </div>`;
  }

  // AI Review card
  const aiCard = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="sec" style="margin:0">🤖 AI Weekly Review</div>
      <button onclick="runAIReview()" style="padding:8px 14px;background:linear-gradient(135deg,#1A1A2E,var(--teal));color:#fff;border:none;border-radius:10px;font-size:12px;font-weight:700">${aiReviewLoading?'Analysing...':'✨ Get Review'}</button>
    </div>
    ${aiReviewLoading?`<div style="text-align:center;padding:20px 0">
      <div style="font-size:24px;animation:spin 1s linear infinite;display:inline-block">⏳</div>
      <div style="font-size:12px;color:#888;margin-top:8px">Claude is reviewing your week...</div>
    </div>`:''}
    ${aiReviewText?`<div style="font-size:13px;color:var(--dark);line-height:1.8;white-space:pre-wrap">${aiReviewText}</div>`:''}
    ${!aiReviewLoading&&!aiReviewText?`<div style="font-size:12px;color:#AAA;text-align:center;padding:16px 0">Tap "Get Review" for a personalised AI analysis of your last 7 days</div>`:''}
  </div>`;

  // Daily log with expandable detail
  const dailyLog = `<div class="card"><div class="sec">Daily Log</div>
    ${h.length===0?'<div style="color:#AAA;font-size:13px;text-align:center;padding:20px 0">No history yet</div>':
      h.map(x=>{
        const open = S.openHistDay===x.date;
        const dayData = open ? LS.get('hlog_'+x.date, null) : null;
        const pOk=x.protein>=tg.protein*0.9, cOk=x.carbs<=tg.carbs*1.1, calOk=x.cal<=tg.cal*1.1;
        return `<div style="border-bottom:1px solid #F5F5F5">
          <div onclick="S.openHistDay=S.openHistDay==='${x.date}'?null:'${x.date}';render()" style="padding:12px 0;cursor:pointer">
            <div style="display:flex;justify-content:space-between;margin-bottom:6px">
              <span style="font-size:13px;font-weight:700;color:var(--dark)">${new Date(x.date+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</span>
              <span style="font-size:13px">${open?'▲':'▼'}</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
              ${[['P',Math.round(x.protein),'g',pOk?'var(--green)':'var(--red)'],['C',Math.round(x.carbs),'g',cOk?'var(--green)':'var(--red)'],['Cal',Math.round(x.cal),'',calOk?'var(--teal)':'var(--gold)']].map(([l,v,u,c])=>`<span style="font-size:11px;background:#F5F5F5;border-radius:6px;padding:2px 7px"><span style="color:${c};font-weight:700">${v}${u}</span> ${l}</span>`).join('')}
              ${x.weight?`<span style="font-size:11px;background:#F5F5F5;border-radius:6px;padding:2px 7px"><span style="color:var(--teal);font-weight:700">${x.weight}kg</span> ⚖</span>`:''}
              ${x.water>0?`<span style="font-size:11px;background:#F5F5F5;border-radius:6px;padding:2px 7px"><span style="color:#42A5F5;font-weight:700">${x.water}L</span> 💧</span>`:''}
              ${x.workoutDone?'<span style="font-size:11px;background:#E8F5E9;border-radius:6px;padding:2px 7px;color:var(--green)">💪 Done</span>':''}
            </div>
          </div>
          ${open&&dayData?`<div style="padding:0 0 12px">
            <div style="font-size:12px;font-weight:700;color:var(--teal);margin-bottom:8px">🍽 Food Logged</div>
            ${dayData.entries&&dayData.entries.length>0?dayData.entries.map(e=>`
              <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #F9F9F9">
                <span style="font-size:12px;color:var(--dark)">${e.name}</span>
                <span style="font-size:11px;color:#888">${e.cal} kcal</span>
              </div>`).join(''):'<div style="font-size:12px;color:#AAA">No food logged</div>'}
            <div style="margin-top:12px;font-size:12px;font-weight:700;color:var(--teal);margin-bottom:8px">📊 Targets vs Actual</div>
            ${[['Protein',Math.round(x.protein),tg.protein,'g',pOk],['Carbs',Math.round(x.carbs),tg.carbs,'g',cOk],['Calories',Math.round(x.cal),tg.cal,'kcal',calOk],['Water',x.water||0,2,'L',x.water>=2]].map(([l,v,t,u,ok])=>`
              <div style="display:flex;justify-content:space-between;padding:4px 0">
                <span style="font-size:12px;color:#555">${l}</span>
                <span style="font-size:12px;font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${v}${u} / ${t}${u} ${ok?'✓':'✗'}</span>
              </div>`).join('')}
            ${dayData.fastBest?`<div style="display:flex;justify-content:space-between;padding:4px 0"><span style="font-size:12px;color:#555">Best Fast</span><span style="font-size:12px;font-weight:700;color:${dayData.fastBest>=19*3600?'var(--green)':'var(--gold)'}">${Math.floor(dayData.fastBest/3600)}h ${Math.floor(dayData.fastBest%3600/60)}m ${dayData.fastBest>=19*3600?'✓':'/ 19h'}</span></div>`:''}
          </div>`:''}
        </div>`;
      }).join('')}
  </div>`;

  return `
    <div style="display:flex;gap:10px;margin-bottom:14px">
      ${[['Days tracked',h.length,'var(--teal)'],['Workouts',h.filter(x=>x.workoutDone).length,'var(--green)'],['Weight now',S.day.weight?S.day.weight+'kg':'—','var(--gold)']].map(([l,v,c])=>`<div style="flex:1;background:#fff;border-radius:12px;padding:12px 10px;box-shadow:var(--shadow);text-align:center"><div style="font-size:20px;font-weight:700;color:${c}">${v}</div><div style="font-size:10px;color:#888;margin-top:2px">${l}</div></div>`).join('')}
    </div>
    ${chart}
    ${aiCard}
    ${dailyLog}`;
}

function render() {
  const t=tots(), tg=tgt(), phnum=ph(), phwk=pw();
  const TABS=[['today','Today'],['tomorrow','Tomorrow'],['log','Log Food'],['fast','Fasting'],['workout','Workout'],['history','History'],['settings','⚙']];
  let content='';
  if(S.tab==='today') content=tabToday();
  else if(S.tab==='tomorrow') content=tabTomorrow();
  else if(S.tab==='log') content=tabLog();
  else if(S.tab==='fast') content=tabFast();
  else if(S.tab==='workout') content=tabWorkout();
  else if(S.tab==='history') content=tabHistory();
  else if(S.tab==='settings') content=tabSettings();

  document.getElementById('app').innerHTML=`
    <div class="hdr">
      <div style="font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.7;margin-bottom:4px">Daily Tracker</div>
      <div style="font-size:20px;font-weight:700;margin-bottom:2px">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div>
      ${S.startDate?`<div style="font-size:11px;opacity:.8;margin-bottom:2px">${PHASE_LABELS[phnum].label} · Week ${Math.min(phwk,12)} of 12</div>`:''}
      ${isTripDay()?'<div style="margin-top:6px;padding:6px 12px;background:var(--gold);border-radius:8px;font-size:12px;font-weight:700;text-align:center">🏖️ Trip Break — Enjoy! Resume Apr 3rd</div>':''}
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="font-size:11px;opacity:.7">Diet:</span>
        <button onclick="setDiet('keto')" style="padding:3px 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:11px;background:${S.diet==='keto'?'rgba(255,255,255,.25)':'transparent'};font-weight:${S.diet==='keto'?'700':'400'}">🥚 Keto</button>
        <button onclick="setDiet('lowcarb')" style="padding:3px 10px;border-radius:12px;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-size:11px;background:${S.diet==='lowcarb'?'rgba(255,255,255,.25)':'transparent'};font-weight:${S.diet==='lowcarb'?'700':'400'}">🫘 Low-Carb Dal</button>
      </div>
      <div style="font-size:11px;opacity:.6;margin-top:4px">19:5 Fasting · Eggetarian</div>
      <div style="display:flex;justify-content:space-around;margin-top:16px;background:rgba(255,255,255,.1);border-radius:16px;padding:14px 8px">
        ${Ring(t.protein,tg.protein,'#66BB6A',70,'Protein','g')}
        ${Ring(t.carbs,tg.carbs,'#F57F17',70,'Carbs','g')}
        ${Ring(t.fat,tg.fat,'#42A5F5',70,'Fat','g')}
        ${Ring(t.cal,tg.cal,'#AB47BC',70,'Cal','kcal')}
      </div>
    </div>
    <div class="tabs">
      ${TABS.map(([tb,l])=>`<button class="tab ${S.tab===tb?'on':''}" onclick="S.tab='${tb}';S.openMeal=null;if('${tb}'!=='workout'&&S.circuit.active)stopCircuit();render()">${l}</button>`).join('')}
    </div>
    <div class="content fade">${content}</div>`;

  if(S.day.fasting&&S.day.fastStart&&!S.fastTimer) startTimer();
}

// ─── PWA INSTALL PROMPT ──────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button in app
  const btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.innerHTML = '📲 Install App';
  btn.style.cssText = 'position:fixed;bottom:80px;right:16px;padding:12px 20px;background:var(--teal);color:#fff;border:none;border-radius:24px;font-size:14px;font-weight:700;font-family:Georgia,serif;box-shadow:0 4px 14px rgba(0,105,92,.4);z-index:9999;cursor:pointer;';
  document.body.appendChild(btn);
  btn.addEventListener('click', async () => {
    btn.remove();
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
  });
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.remove();
  deferredPrompt = null;
});

// ─── SERVICE WORKER ──────────────────────────────────────────────────
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(()=>{});
}

if(S.day.fasting && S.day.fastStart) {
  S.fastElapsed = Math.floor((Date.now()-S.day.fastStart)/1000);
  startTimer();
} else {
  S.fastElapsed = 0;
}
try {
  render();
} catch(e) {
  document.getElementById('app').innerHTML = '<div style="padding:20px;font-family:Georgia,serif;color:#c00"><b>Error loading app:</b><br/>' + e.message + '<br/><pre style="font-size:11px;margin-top:10px;white-space:pre-wrap">' + e.stack + '</pre></div>';
}
</script>
